<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>彼岸花 · 写实</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0d0d1a;font-family:'Segoe UI','PingFang SC',sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:20px;color:#ccc;
  min-height:100vh
}
h1{font-size:26px;color:#e8a0b0;letter-spacing:6px;font-weight:300;margin-bottom:4px}
.sub{color:#6a5a80;font-size:13px;letter-spacing:2px;margin-bottom:12px}
canvas{display:block;border-radius:12px}
.info{
  max-width:500px;margin-top:16px;padding:14px 18px;
  background:rgba(255,255,255,.04);border-radius:12px;
  border:1px solid rgba(255,255,255,.06);font-size:13px;line-height:1.8;color:#a090b8;
  text-align:center
}
.ctrl{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{
  padding:8px 20px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  transition:all .2s;letter-spacing:1px
}
.btn-bloom{background:#c0392b;color:#fff}
.btn-bloom:hover{background:#e74c3c}
.btn-sway{background:#2c3e50;color:#fff}
.btn-sway:hover{background:#34495e}
.btn-scatter{background:#6c3483;color:#fff}
.btn-scatter:hover{background:#8e44ad}
.btn-reset{background:#555;color:#fff}
.btn-reset:hover{background:#777}
</style>
</head>
<body>

<h1>彼岸花</h1>
<p class="sub">Lycoris radiata · 写实风格</p>

<canvas id="flowerCanvas" width="500" height="640"></canvas>

<div class="ctrl">
  <button class="btn btn-bloom" id="btnBloom">🌺 绽放</button>
  <button class="btn btn-sway" id="btnSway">🌬 摇曳</button>
  <button class="btn btn-scatter" id="btnScatter">🍂 散落</button>
  <button class="btn btn-reset" id="btnReset">↺ 重置</button>
</div>

<div class="info">
  彼岸花 · 彼岸花开 · 赤焰凝露 · 自忘川而来<br>
  花瓣如红丝绒般柔美 花蕊似金焰摇曳 幽香暗藏杀机
</div>

<script>
(function(){
'use strict';

var canvas = document.getElementById('flowerCanvas');
var ctx = canvas.getContext('2d');
var W = canvas.width, H = canvas.height;
var W2 = W/2;

// ======================== 花瓣形状 ========================

function drawTepalPath(ctx, len, wid, curl) {
  var w2 = wid*0.5, w3 = wid*0.25;
  var m1 = len*0.38, m2 = len*0.70, m3 = len*0.92;
  var cx = curl * len * 0.16;
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(m1,-w2, m2,-wid, m3+cx,-w3);
  ctx.quadraticCurveTo(len*1.02 + cx*0.4, 0, m3*0.65 + cx, 0);
  ctx.quadraticCurveTo(len*1.02 + cx*0.4, w3, m3+cx, w3);
  ctx.bezierCurveTo(m2, wid, m1, w2, 0,0);
  ctx.closePath();
}

// ======================== 画花 ========================

function drawFlower(ctx, cx, cy, size, rot, bloomT, swayOff) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot + swayOff * 0.025);

  var pl = size * (0.25 + bloomT * 0.75);
  var pw = size * 0.10 * bloomT; if (pw < 0.5) pw = 0.5;
  var sl = pl * 1.5 * (0.15 + bloomT * 0.85);

  // 花瓣
  for (var i = 0; i < 6; i++) {
    var a = (i / 6) * Math.PI * 2 - Math.PI/2 + (i%2===0?0.08:-0.08);
    ctx.save(); ctx.rotate(a);
    var grad = ctx.createRadialGradient(0,0,0, 0,pl*0.5,pl);
    grad.addColorStop(0, 'rgba(195,55,75,0.88)');
    grad.addColorStop(0.25,'rgba(215,65,85,0.9)');
    grad.addColorStop(0.6, 'rgba(185,40,55,0.85)');
    grad.addColorStop(0.85,'rgba(155,25,42,0.75)');
    grad.addColorStop(1, 'rgba(110,15,28,0.4)');
    ctx.fillStyle = grad;
    drawTepalPath(ctx, pl, pw, 0.5 * bloomT);
    ctx.fill();
    if (bloomT > 0.3) {
      ctx.strokeStyle = 'rgba(255,160,180,' + (0.15 * bloomT) + ')';
      ctx.lineWidth = 0.6; ctx.stroke();
    }
    ctx.restore();
  }

  // 雄蕊 — 金焰摇曳
  for (var i = 0; i < 6; i++) {
    var a = (i / 6) * Math.PI * 2 - Math.PI/2 + (i%2===0?0.18:-0.18) + (i-3)*0.06;
    ctx.save(); ctx.rotate(a);
    // 每根雄蕊独立微摆 (金焰跃动感)
    var flicker = Math.sin(state.time * 0.05 + i * 1.8) * 0.035;
    ctx.rotate(flicker);
    var sl2 = sl * (0.82 + i * 0.04);
    // 金焰花丝 (暖金渐变)
    ctx.strokeStyle = 'rgba(255, 190, 50, ' + (0.5 + bloomT * 0.4) + ')';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-sl2); ctx.stroke();
    if (bloomT > 0.2) {
      // 金焰花药 — 火焰状光晕
      var flameSize = 3.5 + Math.sin(state.time * 0.08 + i * 1.5) * 1.2;
      var flameAlpha = 0.6 + Math.sin(state.time * 0.1 + i * 2.0) * 0.2;
      var grd = ctx.createRadialGradient(0, -sl2, 0, 0, -sl2, flameSize * 2.5);
      grd.addColorStop(0, 'rgba(255, 235, 110, ' + flameAlpha + ')');
      grd.addColorStop(0.3, 'rgba(255, 200, 60, ' + flameAlpha * 0.6 + ')');
      grd.addColorStop(0.7, 'rgba(255, 150, 25, ' + flameAlpha * 0.3 + ')');
      grd.addColorStop(1, 'rgba(200, 80, 10, 0)');
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(0, -sl2, flameSize * 2.5, 0, Math.PI * 2); ctx.fill();
      // 焰心高光
      ctx.fillStyle = 'rgba(255, 255, 230, 0.85)';
      ctx.beginPath(); ctx.arc(0, -sl2, 1.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // 花心
  ctx.fillStyle = 'rgba(150,38,55,' + (0.25 + bloomT * 0.25) + ')';
  ctx.beginPath(); ctx.arc(0,0,3.5 * bloomT,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

// ======================== 花梗 (渐尖 + 刺) ========================

function drawStem(ctx, x, y1, y2, bloomT, swayOff) {
  ctx.save();
  var swayX = Math.sin(swayOff) * 6;
  var topW = (4.5 + bloomT * 2) / 2;
  var botW = 0.8;

  // 渐尖茎体 — 顶部宽底部窄，填充形状
  ctx.beginPath();
  ctx.moveTo(x + swayX - topW, y1);
  ctx.quadraticCurveTo(x + swayX - (topW+botW)*0.5, (y1+y2)*0.5, x + swayX - botW, y2);
  ctx.quadraticCurveTo(x + swayX, y2 + 2, x + swayX + botW, y2);
  ctx.quadraticCurveTo(x + swayX + (topW+botW)*0.5, (y1+y2)*0.5, x + swayX + topW, y1);
  ctx.closePath();

  var sg = ctx.createLinearGradient(x - topW, y1, x + topW, y1);
  sg.addColorStop(0, 'rgba(130,42,55,' + (0.7 * bloomT) + ')');
  sg.addColorStop(0.3,'rgba(185,65,80,' + (0.8 * bloomT) + ')');
  sg.addColorStop(0.7,'rgba(165,55,72,' + (0.78 * bloomT) + ')');
  sg.addColorStop(1, 'rgba(120,35,48,' + (0.7 * bloomT) + ')');
  ctx.fillStyle = sg; ctx.fill();

  // 高光线 (左偏)
  ctx.strokeStyle = 'rgba(230,140,160,' + (0.12 * bloomT) + ')';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x + swayX - topW*0.3, y1 + 8);
  ctx.quadraticCurveTo(x + swayX - (topW+botW)*0.25, (y1+y2)*0.5, x + swayX - botW*0.2, y2 - 6);
  ctx.stroke();

  // ---- 刺 (固定大小, 不抖动) ----
  var thornDefs = [
    { t: 0.15, side: 1, sz: 4.0 },
    { t: 0.28, side:-1, sz: 3.6 },
    { t: 0.42, side: 1, sz: 3.2 },
    { t: 0.55, side:-1, sz: 2.8 },
    { t: 0.68, side: 1, sz: 2.3 },
    { t: 0.80, side:-1, sz: 1.8 },
  ];
  for (var i = 0; i < thornDefs.length; i++) {
    var d = thornDefs[i];
    var ty = y1 + d.t * (y2 - y1);
    var lineT = (ty - y1) / (y2 - y1);
    var stemX = x + swayX + (topW - botW) * (1 - lineT) * (-0.15);
    var sz = d.sz * bloomT; if (sz < 0.3) sz = 0.3;
    var sd = d.side;

    // 刺身 (暗红)
    ctx.fillStyle = 'rgba(165,55,72,' + (0.55 * bloomT) + ')';
    ctx.beginPath();
    ctx.moveTo(stemX, ty);
    ctx.lineTo(stemX + sd * sz * 2.2, ty - sz * 0.9);
    ctx.lineTo(stemX + sd * sz * 1.3, ty + sz * 0.4);
    ctx.closePath(); ctx.fill();

    // 刺高光
    ctx.fillStyle = 'rgba(230,140,155,' + (0.12 * bloomT) + ')';
    ctx.beginPath();
    ctx.moveTo(stemX + sd * 0.8, ty - sz * 0.2);
    ctx.lineTo(stemX + sd * sz * 1.6, ty - sz * 0.5);
    ctx.lineTo(stemX + sd * sz * 1.0, ty + sz * 0.05);
    ctx.closePath(); ctx.fill();
  }

  ctx.restore();
}

// ======================== 场景 ========================

var state = {
  bloomT: 1, targetBloom: 1,
  swayPhase: 0, swaySpeed: 0,
  swayActive: false,
  scattered: false,
  particles: [], particleLoop: null,
  time: 0,
};

function drawScene() {
  ctx.clearRect(0,0,W,H);

  var t = state.bloomT;
  var sway = state.swayPhase;
  var stalkX = W2 - 8;
  var stalkTop = 280;
  var stalkBase = 585;

  // 花梗从花心向下凝集，如能量实体化
  var stemEnd = stalkTop + (stalkBase - stalkTop) * t;

  // 深邃渐变背景
  var bg = ctx.createRadialGradient(W2,280,0, W2,320,420);
  bg.addColorStop(0,   '#161638');
  bg.addColorStop(0.3, '#12122a');
  bg.addColorStop(0.7, '#0d0d1e');
  bg.addColorStop(1,   '#080812');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // 微光晕
  var aura = ctx.createRadialGradient(W2 - 10, stalkTop, 0, W2 - 10, stalkTop, 200);
  aura.addColorStop(0, 'rgba(200,60,80,' + (0.04 * t) + ')');
  aura.addColorStop(1, 'rgba(200,60,80,0)');
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(W2 - 10, stalkTop, 200, 0, Math.PI*2); ctx.fill();

  // 摇曳暗红灵气 (画在花后面，作为背光)
  if (state.swayActive) {
    var gi = 0.35 + Math.sin(state.swayPhase * 2) * 0.15;
    var pulseR = 160 + Math.sin(state.swayPhase) * 25;
    var grd = ctx.createRadialGradient(W2-8, stalkTop, 0, W2-8, stalkTop, pulseR);
    grd.addColorStop(0, 'rgba(180, 20, 35, ' + gi + ')');
    grd.addColorStop(0.3, 'rgba(120, 10, 25, ' + gi * 0.6 + ')');
    grd.addColorStop(0.7, 'rgba(60, 5, 15, ' + gi * 0.25 + ')');
    grd.addColorStop(1, 'rgba(20, 0, 5, 0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(W2-8, stalkTop, pulseR, 0, Math.PI*2);
    ctx.fill();
  }

  // 茎 (从花心向下延伸)
  drawStem(ctx, stalkX, stalkTop, stemEnd, t, sway);

  // 花朵集群
  var flowers = [
    { x:0,  y:0,   size:88,  rot:0,    alpha:1.0 },
    { x:-32,y:12,  size:74,  rot:-0.3, alpha:0.7 },
    { x:35, y:15,  size:70,  rot:0.35, alpha:0.65 },
    { x:3,  y:24,  size:62,  rot:0.1,  alpha:0.75 },
    { x:-14,y:-4,  size:66,  rot:-0.2, alpha:0.5 },
  ];
  var order = [4,1,2,3,0];
  for (var d = 0; d < order.length; d++) {
    var f = flowers[order[d]];
    ctx.save();
    ctx.globalAlpha = f.alpha * (0.25 + t * 0.75);
    drawFlower(ctx, stalkX + f.x, stalkTop + f.y, f.size * (0.4 + t * 0.6), f.rot, t, sway + f.x * 0.025);
    ctx.restore();
  }

  // 散射粒子
  if (state.particles.length > 0) drawParticles();
}

// ======================== 粒子 (慢速缓降) ========================

function spawnScatter() {
  if (state.scattered) return;
  state.scattered = true;
  state.targetBloom = 0;

  var cx = W2 - 8, cy = 280;
  var stalkY1 = 280, stalkY2 = 585;

  // ---- 花瓣粒子 (从花心爆开) ----
  var cols = ['#e74c3c','#d63031','#c0392b','#b71540','#e84393','#fd79a8','#ff7675','#d63031'];
  var n = 26 + Math.floor(Math.random() * 16);
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = 1.0 + Math.random() * 1.6;
    var sz = 3 + Math.random() * 8;
    state.particles.push({
      x: cx + (Math.random()-0.5)*20,
      y: cy + (Math.random()-0.5)*15,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 1.2,
      w: sz, h: sz * (1.3 + Math.random() * 0.6),
      rot: Math.random() * Math.PI * 2,
      rs: (Math.random() - 0.5) * 0.008,
      c: cols[i % cols.length],
      life: 0.8 + Math.random() * 0.2,
      de: 0.0018 + Math.random() * 0.002,
      g: 0.014 + Math.random() * 0.012,
      dr: 0.97 + Math.random() * 0.01,
    });
  }

  // ---- 花梗粒子 (原地弥散, 细小粉尘感) ----
  var stemCols = ['#5a1a28','#6e2030','#8a2a3a','#7a2535','#9a3545','#6a2030','#4a1520','#823040'];
  var m = 40 + Math.floor(Math.random() * 20);
  for (var i = 0; i < m; i++) {
    var t = Math.random();
    var ty = stalkY1 + t * (stalkY2 - stalkY1);
    var side = Math.random() * 2 - 1;
    var spread = 0.2 + Math.random() * 0.8;
    var sz = 1.5 + Math.random() * 3.5;
    state.particles.push({
      x: cx + side * (2 + t * 3) + (Math.random()-0.5)*6,
      y: ty + (Math.random()-0.5)*4,
      vx: side * spread * 0.4 + (Math.random()-0.5)*0.3,
      vy: -0.15 - Math.random() * 0.35,
      w: sz, h: sz * (0.8 + Math.random() * 0.4),
      rot: Math.random() * Math.PI * 2,
      rs: (Math.random() - 0.5) * 0.005,
      c: stemCols[i % stemCols.length],
      life: 0.6 + Math.random() * 0.4,
      de: 0.001 + Math.random() * 0.0015,
      g: 0.002 + Math.random() * 0.003,
      dr: 0.98 + Math.random() * 0.01,
    });
  }

  if (!state.particleLoop) state.particleLoop = requestAnimationFrame(particleLoop);
}

function particleLoop() {
  var alive = false;
  for (var i = state.particles.length - 1; i >= 0; i--) {
    var p = state.particles[i];
    p.vx *= p.dr; p.vy *= p.dr;
    p.vy += p.g;
    p.x += p.vx; p.y += p.vy;
    p.rot += p.rs;
    p.life -= p.de;
    if (p.life <= 0 || p.y > H + 40) { state.particles.splice(i,1); continue; }
    alive = true;
  }
  drawParticles();
  if (alive) state.particleLoop = requestAnimationFrame(particleLoop);
  else state.particleLoop = null;
}

function drawParticles() {
  for (var i = 0; i < state.particles.length; i++) {
    var p = state.particles[i];
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.moveTo(0, -p.h/2);
    ctx.quadraticCurveTo(p.w/2, -p.h/4, p.w/2, 0);
    ctx.quadraticCurveTo(p.w/2, p.h/4, 0, p.h/2);
    ctx.quadraticCurveTo(-p.w/2, p.h/4, -p.w/2, 0);
    ctx.quadraticCurveTo(-p.w/2, -p.h/4, 0, -p.h/2);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

// ======================== 主循环 ========================

var animLoop = null;
function startAnimLoop() {
  if (animLoop) return;
  animLoop = requestAnimationFrame(function tick() {
    if (Math.abs(state.bloomT - state.targetBloom) > 0.005) {
      state.bloomT += (state.targetBloom - state.bloomT) * 0.025;
    } else state.bloomT = state.targetBloom;

    if (state.swayActive) {
      state.swayPhase += 0.03;
    } else if (state.swaySpeed > 0.001) {
      state.swayPhase += state.swaySpeed;
      state.swaySpeed *= 0.985;
      if (state.swaySpeed < 0.001) state.swaySpeed = 0;
    }

    state.time++;

    drawScene();
    animLoop = requestAnimationFrame(tick);
  });
}
startAnimLoop();

// ======================== 交互 ========================

document.getElementById('btnBloom').addEventListener('click', function() {
  state.targetBloom = 1; state.scattered = false;
});
document.getElementById('btnSway').addEventListener('click', function() {
  state.swayActive = !state.swayActive;
  var btn = document.getElementById('btnSway');
  if (state.swayActive) {
    btn.textContent = '🌬 摇曳中';
    btn.style.background = '#8e44ad';
  } else {
    btn.textContent = '🌬 摇曳';
    btn.style.background = '#2c3e50';
  }
});
document.getElementById('btnScatter').addEventListener('click', function() {
  if (!state.scattered) {
    state.swayActive = false;
    document.getElementById('btnSway').textContent = '🌬 摇曳';
    document.getElementById('btnSway').style.background = '#2c3e50';
    spawnScatter();
  }
});
document.getElementById('btnReset').addEventListener('click', function() {
  state.targetBloom = 1; state.bloomT = 1;
  state.swayPhase = 0; state.swaySpeed = 0;
  state.swayActive = false;
  state.scattered = false; state.particles = [];
  if (state.particleLoop) { cancelAnimationFrame(state.particleLoop); state.particleLoop = null; }
  document.getElementById('btnSway').textContent = '🌬 摇曳';
  document.getElementById('btnSway').style.background = '#2c3e50';
  drawScene();
});

})();
</script>
</body>
</html>
