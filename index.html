<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>双鱼小栈</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            color: #e8e0f0;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 深海渐变背景 ===== */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            background: linear-gradient(145deg, #1a1d4e 0%, #301d5e 30%, #1d3d5e 60%, #2a1f60 100%);
            background-attachment: fixed;
        }

        /* ===== 深海流韵 ===== */
        .bg-flow {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-flow::before {
            content: '';
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            border-radius: 38%;
            background: radial-gradient(ellipse at 40% 50%, rgba(140, 100, 200, 0.08), transparent 55%);
            animation: flowDrift1 20s ease-in-out infinite;
        }
        .bg-flow::after {
            content: '';
            position: absolute;
            width: 180%; height: 180%;
            top: -40%; left: -40%;
            border-radius: 42%;
            background: radial-gradient(ellipse at 60% 40%, rgba(200, 120, 160, 0.07), transparent 50%);
            animation: flowDrift2 25s ease-in-out infinite;
        }
        @keyframes flowDrift1 {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            20%  { transform: translate(8%, -5%) rotate(35deg) scale(1.04); }
            40%  { transform: translate(-4%, 8%) rotate(75deg) scale(0.96); }
            60%  { transform: translate(-8%, -3%) rotate(115deg) scale(1.02); }
            80%  { transform: translate(4%, 6%) rotate(165deg) scale(0.98); }
            100% { transform: translate(0, 0) rotate(220deg) scale(1); }
        }
        @keyframes flowDrift2 {
            0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
            25%  { transform: translate(-6%, -8%) rotate(-45deg) scale(1.03); }
            50%  { transform: translate(6%, 4%) rotate(-95deg) scale(0.97); }
            75%  { transform: translate(-3%, 6%) rotate(-145deg) scale(1.01); }
            100% { transform: translate(0, 0) rotate(-200deg) scale(1); }
        }

        /* ===== Canvas 星空层 ===== */
        #star-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== 玫瑰花瓣 ===== */
        .petals {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 20;
            overflow: hidden;
        }
        .p {
            position: absolute;
            border-radius: 50% 0 50% 0;
            opacity: 0;
        }
        .p:nth-child(1)  { left: 5%;  width: 14px; height: 16px; animation: fall1 26s linear infinite; animation-delay: 0s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #ec407a); }
        .p:nth-child(2)  { left: 15%; width: 20px; height: 22px; animation: fall2 30s linear infinite; animation-delay: 4s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #d81b60); }
        .p:nth-child(3)  { left: 28%; width: 12px; height: 14px; animation: fall3 28s linear infinite; animation-delay: 7s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #f06292); }
        .p:nth-child(4)  { left: 40%; width: 22px; height: 24px; animation: fall4 32s linear infinite; animation-delay: 2s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #e91e63); }
        .p:nth-child(5)  { left: 52%; width: 16px; height: 18px; animation: fall1 27s linear infinite; animation-delay: 9s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #d81b60); }
        .p:nth-child(6)  { left: 62%; width: 20px; height: 22px; animation: fall2 33s linear infinite; animation-delay: 5s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #f06292); }
        .p:nth-child(7)  { left: 75%; width: 14px; height: 16px; animation: fall3 29s linear infinite; animation-delay: 3s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #ec407a); }
        .p:nth-child(8)  { left: 85%; width: 18px; height: 20px; animation: fall4 31s linear infinite; animation-delay: 8s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #d81b60); }
        .p:nth-child(9)  { left: 48%; width: 16px; height: 18px; animation: fall1 35s linear infinite; animation-delay: 11s; background: radial-gradient(circle at 30% 30%, #f8bbd0, #f06292); }
        .p:nth-child(10) { left: 92%; width: 15px; height: 17px; animation: fall2 25s linear infinite; animation-delay: 6s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #e91e63); }
        .p:nth-child(11) { left: 22%; width: 19px; height: 21px; animation: fall3 34s linear infinite; animation-delay: 12s; background: radial-gradient(circle at 30% 30%, #f8bbd0, #d81b60); }
        .p:nth-child(12) { left: 68%; width: 13px; height: 15px; animation: fall4 28s linear infinite; animation-delay: 10s; background: radial-gradient(circle at 30% 30%, #f48fb1, #f06292); }

        @keyframes fall1 {
            0%   { transform: translateY(-8vh) rotate(35deg) translateX(20px); opacity: 0; }
            4%   { opacity: 0.5; }
            30%  { transform: translateY(20vh) rotate(120deg) translateX(18px); opacity: 0.55; }
            60%  { transform: translateY(55vh) rotate(260deg) translateX(-12px); opacity: 0.35; }
            85%  { opacity: 0.15; }
            100% { transform: translateY(108vh) rotate(420deg) translateX(8px); opacity: 0; }
        }
        @keyframes fall2 {
            0%   { transform: translateY(-10vh) rotate(-25deg) translateX(-15px); opacity: 0; }
            5%   { opacity: 0.5; }
            35%  { transform: translateY(25vh) rotate(-130deg) translateX(-20px); opacity: 0.55; }
            65%  { transform: translateY(58vh) rotate(-270deg) translateX(15px); opacity: 0.30; }
            85%  { opacity: 0.10; }
            100% { transform: translateY(110vh) rotate(-450deg) translateX(-5px); opacity: 0; }
        }
        @keyframes fall3 {
            0%   { transform: translateY(-6vh) rotate(50deg) translateX(-22px); opacity: 0; }
            4%   { opacity: 0.45; }
            40%  { transform: translateY(30vh) rotate(90deg) translateX(25px); opacity: 0.50; }
            70%  { transform: translateY(60vh) rotate(200deg) translateX(-18px); opacity: 0.30; }
            85%  { opacity: 0.12; }
            100% { transform: translateY(108vh) rotate(360deg) translateX(10px); opacity: 0; }
        }
        @keyframes fall4 {
            0%   { transform: translateY(-12vh) rotate(-40deg) translateX(14px); opacity: 0; }
            5%   { opacity: 0.5; }
            35%  { transform: translateY(22vh) rotate(-100deg) translateX(-15px); opacity: 0.55; }
            65%  { transform: translateY(50vh) rotate(-220deg) translateX(20px); opacity: 0.35; }
            85%  { opacity: 0.15; }
            100% { transform: translateY(108vh) rotate(-380deg) translateX(-8px); opacity: 0; }
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            padding: 50px 20px 30px;
        }
        .header .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .header .ornament .bar {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #f48fb1, transparent);
        }
        .header .ornament .dot {
            width: 7px; height: 7px;
            background: #f48fb1;
            transform: rotate(45deg);
            border-radius: 1px;
            box-shadow: 0 0 8px rgba(244, 143, 177, 0.5);
        }
        .header h1 {
            font-size: 44px;
            font-weight: 700;
            background: linear-gradient(135deg, #b39ddb, #f48fb1, #81d4fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 8px;
        }
        .header .subtitle {
            margin-top: 12px;
            font-size: 15px;
            color: #8a7aaa;
            letter-spacing: 4px;
            font-weight: 300;
        }
        .header .divider {
            width: 100px;
            height: 2px;
            margin: 22px auto 0;
            background: linear-gradient(90deg, transparent, #f48fb1, transparent);
            border-radius: 2px;
        }

        /* ===== 标签 ===== */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 36px 0 30px;
        }
        .tab-btn {
            padding: 12px 32px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.06);
            color: #b8a0cc;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 2px;
        }
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(244, 143, 177, 0.2);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(120, 80, 180, 0.4), rgba(200, 60, 120, 0.3));
            border-color: rgba(244, 143, 177, 0.3);
            color: #e8d8f0;
            box-shadow: 0 4px 20px rgba(150, 80, 180, 0.15);
        }

        .tab-content { display: none; animation: fadeUp 0.5s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== 卡片 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(244, 143, 177, 0.2);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 30px rgba(100, 60, 160, 0.15);
        }
        .card .icon { font-size: 28px; margin-bottom: 8px; }
        .card h3 { font-size: 17px; font-weight: 600; color: #e0d0e8; margin-bottom: 4px; }
        .card p  { font-size: 13px; color: #8a7aaa; line-height: 1.6; }

        /* ===== 关于 ===== */
        .about-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 44px 36px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }
        .about-card h2 { font-size: 26px; font-weight: 700; color: #e0d0e8; margin-bottom: 14px; }
        .about-card .bio { font-size: 15px; color: #a090b8; line-height: 2; }
        .about-card .bio .hl { color: #f48fb1; font-weight: 600; }
        .about-card .divider-sm {
            width: 50px; height: 1px;
            margin: 20px auto 0;
            background: linear-gradient(90deg, transparent, #f48fb1, transparent);
        }

        .footer {
            text-align: center;
            padding: 40px 20px 20px;
            color: #6a5a80;
            font-size: 13px;
            letter-spacing: 2px;
        }

        /* ===== 花瓣交互 ===== */
        .p { pointer-events: auto; cursor: pointer; }

        @media (max-width: 640px) {
            .header h1 { font-size: 30px; letter-spacing: 5px; }
            .tabs { flex-direction: column; align-items: center; gap: 10px; }
            .tab-btn { width: 200px; }
            .about-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="bg-flow"></div>
    <canvas id="star-canvas"></canvas>

    <div class="petals">
        <div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div>
        <div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div>
        <div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="ornament">
                <span class="bar"></span>
                <span class="dot"></span>
                <span class="bar"></span>
            </div>
            <h1>双鱼小栈</h1>
            <p class="subtitle">— 收藏美好 · 静待花开 —</p>
            <div class="divider"></div>
        </header>

        <nav class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="tools">🧰 常用工具</button>
            <button class="tab-btn" data-tab="study">📚 学习空间</button>
            <button class="tab-btn" data-tab="about">🌸 关于</button>
        </nav>

        <section class="tab-content active" id="tab-tools"><div class="grid" id="tools-grid"></div></section>
        <section class="tab-content" id="tab-study"><div class="grid" id="study-grid"></div></section>

        <section class="tab-content" id="tab-about">
            <div class="about-card">
                <h2>关于双鱼小栈</h2>
                <p class="bio">
                    这里是 <span class="hl">Jacky</span> 的小小收藏馆。<br>
                    喜欢把实用的工具和有趣的知识<br>像花瓣一样一片片收集起来。<br><br>
                    愿来到这里的你，也能找到属于你的那片花瓣
                </p>
                <div class="divider-sm"></div>
            </div>
        </section>

        <footer class="footer">Made with love by Jacky · 双鱼小栈</footer>
    </div>

    <script>
        // ================================================================
        //  数据
        // ================================================================
        const tools = [
            { icon: '🎨', name: 'Canva',           desc: '在线设计工具',        url: 'https://www.canva.com' },
            { icon: '🕰️', name: '时光摆',          desc: '桌面双摆模拟器',     url: 'pendulum.html' },
            { icon: '🎸', name: '吉他谱',           desc: '吉他谱收藏',         url: 'guitar.html' },
            { icon: '🎮', name: '小游戏',           desc: '2048 · 扫雷 · 贪吃蛇 · Flappy Bird', url: 'games.html' },
        ];
        const study = [
            { icon: '📊', name: 'Kaggle',          desc: '数据科学 & 机器学习',  url: 'https://www.kaggle.com' },
            { icon: '📺', name: 'Bilibili',        desc: '视频学习平台',         url: 'https://www.bilibili.com' },
        ];

        function renderCards(id, data) {
            const g = document.getElementById(id);
            if (!data || !data.length) {
                g.innerHTML = '<div class="empty-state" style="text-align:center;padding:60px 0;color:#6a5a80"><div style="font-size:48px;margin-bottom:12px">🌸</div><p>还没有内容～</p></div>';
                return;
            }
            g.innerHTML = data.map(d =>
                `<div class="card" onclick="window.open('${d.url}','_blank')">
                    <div class="icon">${d.icon}</div>
                    <h3>${d.name}</h3>
                    <p>${d.desc}</p>
                </div>`
            ).join('');
        }
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });
        renderCards('tools-grid', tools);
        renderCards('study-grid', study);

        // ================================================================
        //  星空 Canvas — 漫画风格闪光星星 + 双鱼座星座
        // ================================================================
        (function() {
            const canvas = document.getElementById('star-canvas');
            const ctx = canvas.getContext('2d');
            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // ---- 漫画风格闪光星星绘制函数 ----
            // 4 角星（漫画闪光的经典形状，类似 ✨）
            function drawSparkle(cx, cy, size, color, rotation) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(rotation || 0);
                ctx.beginPath();
                // 使用贝塞尔曲线绘制柔和四角星
                const s = size;
                // 上顶点 → 右上凹 → 右顶点 → 右下凹 → 下顶点 → 左下凹 → 左顶点 → 左上凹
                const pts = [
                    { x: 0,    y: -s },   // 上
                    { x: s*0.3, y: -s*0.3 },
                    { x: s,    y: 0 },    // 右
                    { x: s*0.3, y: s*0.3 },
                    { x: 0,    y: s },    // 下
                    { x: -s*0.3, y: s*0.3 },
                    { x: -s,   y: 0 },    // 左
                    { x: -s*0.3, y: -s*0.3 },
                ];
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();

                // 中心高光小圆
                ctx.beginPath();
                ctx.arc(0, 0, s * 0.12, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fill();

                ctx.restore();
            }

            // ---- 1. 背景星星 ----
            // 两种类型: 小圆点 + 漫画闪光星
            const STARS = 100;
            const stars = [];
            // 小圆点用色板 — 无金色
            const dotColors = [
                { r: 210, g: 130, b: 255 },  // 亮紫
                { r: 255, g: 130, b: 180 },  // 亮粉
                { r: 130, g: 180, b: 255 },  // 亮蓝
                { r: 200, g: 140, b: 255 },  // 紫罗兰
                { r: 255, g: 150, b: 200 },  // 玫瑰粉
            ];
            // 漫画闪光星用色板 — 金碧辉煌
            const sparkleColors = [
                { r: 255, g: 215, b: 50 },   // 亮金
                { r: 255, g: 230, b: 80 },   // 浅金
                { r: 255, g: 200, b: 0 },    // 纯金
                { r: 255, g: 185, b: 40 },   // 暖金
                { r: 255, g: 220, b: 120 },  // 香槟金
            ];

            for (let i = 0; i < STARS; i++) {
                const isSparkle = Math.random() < 0.30; // 30% 是闪光星
                const col = isSparkle
                    ? sparkleColors[Math.floor(Math.random() * sparkleColors.length)]
                    : dotColors[Math.floor(Math.random() * dotColors.length)];
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: isSparkle ? Math.random() * 6 + 4 : Math.random() * 2.0 + 0.8,
                    type: isSparkle ? 'sparkle' : 'dot',
                    isGold: isSparkle,
                    col,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.00025,
                    s1: Math.random() * 0.012 + 0.004,
                    s2: Math.random() * 0.022 + 0.010,
                    p1: Math.random() * Math.PI * 2,
                    p2: Math.random() * Math.PI * 2,
                    depth: Math.random() * 0.55 + 0.25,
                    baseA: Math.random() * 0.35 + 0.35,  // 更高基础透明度
                });
            }

            // ---- 2. 双鱼座星座 ----
            // 真实形状: 西侧环状(Circlet) + 东侧鱼 + 中央结星(Alrescha)以V形绳带连接
            const pts = [
                // 西鱼 Circlet (小环)
                { x: 0.18, y: 0.38 },  // 0
                { x: 0.26, y: 0.35 },  // 1
                { x: 0.33, y: 0.38 },  // 2
                { x: 0.31, y: 0.47 },  // 3
                { x: 0.23, y: 0.50 },  // 4
                { x: 0.16, y: 0.45 },  // 5
                // 结星 Alrescha (α Psc)
                { x: 0.41, y: 0.44 },  // 6 ★
                // 东鱼 (斜向弧线)
                { x: 0.49, y: 0.42 },  // 7
                { x: 0.55, y: 0.39 },  // 8
                { x: 0.61, y: 0.36 },  // 9
                { x: 0.68, y: 0.38 },  // 10
                { x: 0.73, y: 0.42 },  // 11
                { x: 0.67, y: 0.48 },  // 12
                { x: 0.58, y: 0.47 },  // 13
            ];

            let cst;
            function updCst() { cst = pts.map(p => ({ x: p.x * W, y: p.y * H })); }
            updCst();
            window.addEventListener('resize', updCst);

            const edges = [
                // Circlet (group 0)
                [0, 1, 0], [1, 2, 0], [2, 3, 0], [3, 4, 0], [4, 5, 0], [5, 0, 0],
                // 绳带 (group 2)
                [2, 6, 2], [6, 7, 2],
                // 东鱼 (group 1)
                [7, 8, 1], [8, 9, 1], [9, 10, 1], [10, 11, 1],
                [11, 12, 1], [12, 13, 1], [13, 7, 1],
            ];
            const grpPh = [0, 2.5, 4.2];

            const cstParams = pts.map(() => ({
                speed: 0.008 + Math.random() * 0.012,
                phase: Math.random() * Math.PI * 2,
                depth: 0.3 + Math.random() * 0.4,
            }));

            // ---- 3. 渲染循环 ----
            let frame = 0;

            function draw() {
                ctx.clearRect(0, 0, W, H);
                frame++;

                // --- 背景星星 ---
                for (const s of stars) {
                    const w1 = Math.sin(frame * s.s1 + s.p1);
                    const w2 = Math.sin(frame * s.s2 + s.p2) * 0.35;
                    const tw = (w1 + w2) * s.depth * 0.45 + (1 - s.depth * 0.45);
                    const a = s.baseA * Math.max(0.05, tw);
                    const { r, g, b } = s.col;

                    if (s.type === 'dot') {
                        // 圆点星: 大光晕 + 彩色核心 + 白色高光
                        const gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 5);
                        gr.addColorStop(0, `rgba(${r},${g},${b},${a * 0.2})`);
                        gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        ctx.fillStyle = gr;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * 5, 0, Math.PI * 2);
                        ctx.fill();

                        // 彩色内核
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * Math.max(0.4, tw), 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${r},${g},${b},${a * 0.9})`;
                        ctx.fill();

                        // 白色高光核心
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * 0.35, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,255,255,${a * 0.6})`;
                        ctx.fill();
                    } else {
                        // 漫画闪光星 — 高光强化版
                        const bright = Math.max(0.3, tw);
                        s.rot += s.rotSpeed;
                        const color = `rgba(${r},${g},${b},${a * 0.9})`;
                        drawSparkle(s.x, s.y, s.r * bright, color, s.rot);

                        // 金色闪光星
                        const glowMul = s.isGold ? 5 : 4;
                        const glowOp = s.isGold ? 0.18 : 0.15;

                        // 大光晕
                        const gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * glowMul);
                        gr.addColorStop(0, `rgba(${r},${g},${b},${glowOp * a})`);
                        gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        ctx.fillStyle = gr;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * glowMul, 0, Math.PI * 2);
                        ctx.fill();

                        // 金色额外暖色外光晕
                        if (s.isGold) {
                            const g2 = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 7);
                            g2.addColorStop(0, `rgba(255, 180, 50, ${0.07 * a})`);
                            g2.addColorStop(1, `rgba(255, 180, 50, 0)`);
                            ctx.fillStyle = g2;
                            ctx.beginPath();
                            ctx.arc(s.x, s.y, s.r * 10, 0, Math.PI * 2);
                            ctx.fill();
                        }

                        // 高光十字线 (漫画闪光标志)
                        ctx.beginPath();
                        const hl = s.r * bright * (s.isGold ? 1.2 : 1.1);
                        ctx.moveTo(s.x - hl * 0.5, s.y - hl * 0.5);
                        ctx.lineTo(s.x + hl * 0.5, s.y + hl * 0.5);
                        ctx.moveTo(s.x - hl * 0.5, s.y + hl * 0.5);
                        ctx.lineTo(s.x + hl * 0.5, s.y - hl * 0.5);
                        ctx.strokeStyle = `rgba(255,255,255,${s.isGold ? a * 0.35 : a * 0.2})`;
                        ctx.lineWidth = s.isGold ? 0.7 : 0.5;
                        ctx.stroke();
                    }
                }

                // --- 星座连线 (呼吸亮线，无光晕) ---
                for (const [i, j, g] of edges) {
                    const p1 = cst[i], p2 = cst[j];
                    const breath = Math.sin(frame * 0.008 + grpPh[g] + i * 0.25) * 0.35 + 0.65;
                    const la = 0.20 + breath * 0.50;
                    const isCord = g === 2;
                    const mainColor = isCord
                        ? `rgba(255, 240, 180, ${la})`
                        : `rgba(210, 220, 255, ${la})`;
                    const lw = 1.0 + breath * 0.6;

                    // 清晰亮线
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = mainColor;
                    ctx.lineWidth = lw;
                    ctx.stroke();
                }

                // --- 星座星星 (仅结星金色，其余蓝白色) ---
                for (let i = 0; i < cst.length; i++) {
                    const p = cst[i];
                    const cp = cstParams[i];
                    const isKnot = i === 6;

                    const tw = Math.sin(frame * cp.speed + cp.phase) * cp.depth * 0.4 + (1 - cp.depth * 0.4);
                    const a = Math.max(0.25, tw);

                    const baseSize = isKnot ? 12 : 8;
                    const glowR = isKnot ? 45 : 24;

                    if (isKnot) {
                        // 结星 Alrescha — 金色
                        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
                        grd.addColorStop(0, `rgba(255, 215, 60, ${0.25 * a})`);
                        grd.addColorStop(1, `rgba(255, 215, 60, 0)`);
                        ctx.fillStyle = grd;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
                        ctx.fill();

                        drawSparkle(p.x, p.y, baseSize * a, `rgba(255, 215, 50, ${0.95 * a})`, frame * 0.0015 + i * 1.2);

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 220, ${0.85 * a})`;
                        ctx.fill();

                        const g2 = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 22);
                        g2.addColorStop(0, `rgba(255, 220, 100, ${0.15 * a})`);
                        g2.addColorStop(1, `rgba(255, 220, 100, 0)`);
                        ctx.fillStyle = g2;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 22, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // 普通星座星 — 蓝白色
                        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
                        grd.addColorStop(0, `rgba(180, 200, 240, ${0.15 * a})`);
                        grd.addColorStop(1, `rgba(180, 200, 240, 0)`);
                        ctx.fillStyle = grd;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
                        ctx.fill();

                        drawSparkle(p.x, p.y, baseSize * a, `rgba(180, 200, 240, ${0.85 * a})`, frame * 0.0015 + i * 1.2);
                    }
                }


                requestAnimationFrame(draw);
            }

            draw();

            window.addEventListener('resize', () => {
                for (const s of stars) {
                    s.x = Math.random() * W;
                    s.y = Math.random() * H;
                }
            });
        })();
    </script>

    <script>
        // ================================================================
        //  花瓣点击交互 — 碎裂 & 玫瑰花（支持移动端触摸）
        // ================================================================
        function handlePetalEvent(e) {
            if (e.type === 'touchend') e.preventDefault();
            if (e.currentTarget._rm) return;
            e.currentTarget._rm = true;

            const p = e.currentTarget;
            const rect = p.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;

            // 原花瓣平滑消散（隐藏原花瓣 → 创建克隆体做过渡，避免CSS动画干扰）
            const pop = getComputedStyle(p).opacity;
            const bg = getComputedStyle(p).background;
            p.style.display = 'none';
            const ghost = document.createElement('div');
            ghost.style.cssText = [
                'position:fixed',
                `left:${rect.left}px;top:${rect.top}px`,
                `width:${rect.width}px;height:${rect.height}px`,
                'border-radius:50% 0 50% 0',
                `background:${bg}`,
                `opacity:${pop}`,
                'pointer-events:none;z-index:31',
                'transition:opacity 500ms ease-out, transform 500ms ease-out',
            ].join(';');
            document.body.appendChild(ghost);
            void ghost.offsetHeight;
            ghost.style.opacity = '0';
            ghost.style.transform = 'scale(0.2)';
            setTimeout(() => ghost.remove(), 550);

            // 45% 概率触发彼岸花散落，55% 概率触发原有效果
            if (Math.random() < 0.45) {
                shatterBihua(cx, cy);
            } else {
                shatter(cx, cy);
            }
        }

        document.querySelectorAll('.p').forEach(p => {
            p.addEventListener('click', handlePetalEvent);
            p.addEventListener('touchend', handlePetalEvent);
        });

        // ---- 碎裂花瓣 (Canvas 物理引擎: 花瓣形/速度/重力/阻力/旋转/淡出) ----
        const _pt = { c:null, q:null, ps:[], id:null };
        function _pc() {
            if (!_pt.c) {
                _pt.c = document.createElement('canvas');
                _pt.c.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:30';
                _pt.c.width = innerWidth;
                _pt.c.height = innerHeight;
                document.body.appendChild(_pt.c);
                _pt.q = _pt.c.getContext('2d');
                addEventListener('resize', () => { _pt.c.width = innerWidth; _pt.c.height = innerHeight; });
            }
        }
        function shatter(x, y) {
            _pc();
            const cols = ['#f8bbd0','#f48fb1','#f06292','#ec407a','#e91e63','#d81b60','#ffb3c6','#ff8fab'];
            const n = 6 + Math.floor(Math.random() * 6);               // 6~11 片
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2;
                const sp = 0.5 + Math.random() * 2.5;                  // 慢速爆开
                const sz = 4 + Math.random() * 5;
                _pt.ps.push({
                    x, y,
                    vx: Math.cos(a) * sp,
                    vy: Math.sin(a) * sp - 1.2,
                    w: sz,
                    h: sz * (0.8 + Math.random() * 0.6),
                    rot: Math.random() * Math.PI * 2,
                    rs: (Math.random() - 0.5) * 0.15,
                    c: cols[i % cols.length],
                    life: 1,
                    de: 0.006 + Math.random() * 0.008,
                    g: 0.06 + Math.random() * 0.03,
                    dr: 0.93 + Math.random() * 0.03,                  // 强阻力 0.93~0.96
                });
            }
            if (!_pt.id) _pt.id = requestAnimationFrame(_pu);
        }
        function _pu() {
            const ctx = _pt.q, W = _pt.c.width, H = _pt.c.height;
            ctx.clearRect(0, 0, W, H);
            let alive = false;
            for (let i = _pt.ps.length - 1; i >= 0; i--) {
                const p = _pt.ps[i];
                p.vx *= p.dr;
                p.vy *= p.dr;
                p.vy += p.g;
                p.x += p.vx;
                p.y += p.vy;
                p.rot += p.rs;
                p.life -= p.de;
                if (p.life <= 0 || p.y > H + 50) { _pt.ps.splice(i,1); continue; }
                alive = true;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.c;
                // 花瓣形 (border-radius: 50% 0 50% 0)
                ctx.beginPath();
                ctx.moveTo(0, -p.h/2);
                ctx.quadraticCurveTo(p.w/2, -p.h/4, p.w/2, 0);
                ctx.quadraticCurveTo(p.w/2, p.h/4, 0, p.h/2);
                ctx.quadraticCurveTo(-p.w/2, p.h/4, -p.w/2, 0);
                ctx.quadraticCurveTo(-p.w/2, -p.h/4, 0, -p.h/2);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            if (alive) _pt.id = requestAnimationFrame(_pu);
            else { _pt.id = null; setTimeout(() => ctx.clearRect(0,0,W,H), 50); }
        }

        // ---- 彼岸花散落 (低概率触发: 先现花, 再散裂) ----
        function shatterBihua(x, y) {
            // 临时浮层 — 绘制彼岸花后散落
            var wrap = document.createElement('div');
            wrap.style.cssText = 'position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:32';
            document.body.appendChild(wrap);

            var cv = document.createElement('canvas');
            cv.width = 240; cv.height = 300;
            cv.style.cssText = 'position:absolute;left:'+(x-120)+'px;top:'+(y-230)+'px;opacity:1;transition:opacity 700ms';
            wrap.appendChild(cv);

            var cx = cv.getContext('2d');
            var W = cv.width, H = cv.height, W2 = W/2;

            // ---- 花瓣路径 (同 bihua.html) ----
            function petalPath(c, len, wid, curl) {
                var w2=wid*0.5, m1=len*0.38, m2=len*0.70, m3=len*0.92;
                var cx2=curl*len*0.16;
                c.beginPath();
                c.moveTo(0,0);
                c.bezierCurveTo(m1,-w2, m2,-wid, m3+cx2,-w2*0.6);
                c.quadraticCurveTo(len*1.02+cx2*0.4,0, m3*0.65+cx2,0);
                c.quadraticCurveTo(len*1.02+cx2*0.4,w2*0.6, m3+cx2,w2*0.6);
                c.bezierCurveTo(m2,wid, m1,w2, 0,0);
                c.closePath();
            }

            // ---- 一朵花 ----
            function drawOne(c, cx_, cy_, size, rot) {
                c.save();
                c.translate(cx_, cy_);
                c.rotate(rot);
                // 6 枚花瓣
                for (var i = 0; i < 6; i++) {
                    var a = (i/6)*Math.PI*2 - Math.PI/2 + (i%2===0?0.08:-0.08);
                    c.save(); c.rotate(a);
                    var gr = c.createRadialGradient(0,0,0, 0,size*0.5,size);
                    gr.addColorStop(0,'rgba(195,55,75,0.92)');
                    gr.addColorStop(0.4,'rgba(215,65,85,0.92)');
                    gr.addColorStop(0.7,'rgba(175,38,52,0.85)');
                    gr.addColorStop(1,'rgba(120,20,35,0.6)');
                    c.fillStyle = gr;
                    petalPath(c, size, size*0.10, 0.5);
                    c.fill();
                    c.restore();
                }
                // 雄蕊
                for (var i = 0; i < 6; i++) {
                    var a = (i/6)*Math.PI*2 - Math.PI/2 + (i%2===0?0.18:-0.18)+(i-3)*0.06;
                    c.save(); c.rotate(a);
                    var sl = size*1.4;
                    c.strokeStyle = 'rgba(200,85,105,0.55)';
                    c.lineWidth = 0.8;
                    c.beginPath(); c.moveTo(0,0); c.lineTo(0,-sl); c.stroke();
                    c.fillStyle = '#b54a4a';
                    c.beginPath(); c.arc(0,-sl,1.8,0,Math.PI*2); c.fill();
                    c.fillStyle = 'rgba(255,200,110,0.25)';
                    c.beginPath(); c.arc(0,-sl,0.7,0,Math.PI*2); c.fill();
                    c.restore();
                }
                // 花心
                c.fillStyle = 'rgba(150,38,55,0.4)';
                c.beginPath(); c.arc(0,0,3,0,Math.PI*2); c.fill();
                c.restore();
            }

            // ---- 绘制花簇 (2 朵) ----
            function drawFlowers(c) {
                // 花梗
                c.save();
                c.beginPath();
                c.moveTo(W2-3, 220);
                c.lineTo(W2-1, 50);
                c.lineTo(W2+1, 50);
                c.lineTo(W2+3, 220);
                c.closePath();
                var sg = c.createLinearGradient(W2-3,100,W2+3,100);
                sg.addColorStop(0,'rgba(130,42,55,0.7)');
                sg.addColorStop(0.5,'rgba(175,55,72,0.8)');
                sg.addColorStop(1,'rgba(120,35,48,0.7)');
                c.fillStyle = sg; c.fill();
                c.restore();

                // 主花
                drawOne(c, W2, 45, 75, 0);
                // 侧花
                drawOne(c, W2-22, 58, 55, -0.25);
            }

            // ---- 微光晕 ----
            var aura = cx.createRadialGradient(W2,50,0,W2,50,120);
            aura.addColorStop(0,'rgba(200,60,80,0.08)');
            aura.addColorStop(1,'rgba(200,60,80,0)');
            cx.fillStyle = aura;
            cx.beginPath(); cx.arc(W2,50,120,0,Math.PI*2); cx.fill();

            drawFlowers(cx);

            // ---- 停留后散裂 ----
            setTimeout(function() {
                // 散裂粒子 (大小比例参照 bihua.html: 花75~88px / 粒子3~11px)
                var cols = ['#e74c3c','#d63031','#c0392b','#b71540','#e84393','#fd79a8','#ff7675','#d63031'];
                var n = 26 + Math.floor(Math.random() * 16);
                for (var i = 0; i < n; i++) {
                    var a2 = Math.random() * Math.PI * 2;
                    var sp = 1.0 + Math.random() * 1.6;
                    var sz = 4 + Math.random() * 7;
                    _pt.ps.push({
                        x: x + (Math.random()-0.5)*20,
                        y: y + (Math.random()-0.5)*15,
                        vx: Math.cos(a2) * sp,
                        vy: Math.sin(a2) * sp - 1.0,
                        w: sz,
                        h: sz * (1.0 + Math.random() * 0.5),
                        rot: Math.random() * Math.PI * 2,
                        rs: (Math.random() - 0.5) * 0.008,
                        c: cols[i % cols.length],
                        life: 1,
                        de: 0.0018 + Math.random() * 0.002,
                        g: 0.014 + Math.random() * 0.012,
                        dr: 0.97 + Math.random() * 0.01,
                    });
                }
                if (!_pt.id) _pt.id = requestAnimationFrame(_pu);

                // 浮层淡出
                cv.style.opacity = '0';
                setTimeout(function() { wrap.remove(); }, 750);
            }, 600);
        }

    </script>
