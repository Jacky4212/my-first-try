<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双鱼小栈</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            color: #3d2c4a;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 渐变背景 ===== */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            background: linear-gradient(145deg, #f0e6ff 0%, #fce4ec 40%, #e3f2fd 100%);
            background-attachment: fixed;
        }

        /* ===== Canvas 星空层 ===== */
        #star-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* ===== 玫瑰花瓣 ===== */
        .floating-petals {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            width: 20px;
            height: 24px;
            border-radius: 50% 0 50% 0;
            opacity: 0;
            animation: floatPetal linear infinite;
        }
        .petal:nth-child(1)  { left: 5%;  width: 14px; height: 16px; animation-duration: 17s; animation-delay: 0s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #ec407a); }
        .petal:nth-child(2)  { left: 15%; width: 20px; height: 22px; animation-duration: 21s; animation-delay: 3s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #d81b60); }
        .petal:nth-child(3)  { left: 28%; width: 12px; height: 14px; animation-duration: 18s; animation-delay: 5s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #f06292); }
        .petal:nth-child(4)  { left: 40%; width: 24px; height: 26px; animation-duration: 23s; animation-delay: 1s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #ec407a); }
        .petal:nth-child(5)  { left: 52%; width: 16px; height: 18px; animation-duration: 20s; animation-delay: 7s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #d81b60); }
        .petal:nth-child(6)  { left: 62%; width: 22px; height: 24px; animation-duration: 22s; animation-delay: 4s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #f06292); }
        .petal:nth-child(7)  { left: 75%; width: 14px; height: 16px; animation-duration: 19s; animation-delay: 2s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #ec407a); }
        .petal:nth-child(8)  { left: 85%; width: 20px; height: 22px; animation-duration: 16s; animation-delay: 6s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #d81b60); }
        .petal:nth-child(9)  { left: 48%; width: 18px; height: 20px; animation-duration: 24s; animation-delay: 9s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #f06292); }
        .petal:nth-child(10) { left: 92%; width: 15px; height: 17px; animation-duration: 18s; animation-delay: 8s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #ec407a); }
        .petal:nth-child(11) { left: 22%; width: 19px; height: 21px; animation-duration: 25s; animation-delay: 10s; background: radial-gradient(circle at 30% 30%, #f8bbd0, #d81b60); }
        .petal:nth-child(12) { left: 68%; width: 13px; height: 15px; animation-duration: 20s; animation-delay: 11s; background: radial-gradient(circle at 30% 30%, #f48fb1, #f06292); }
        @keyframes floatPetal {
            0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            8%   { opacity: 0.45; }
            20%  { transform: translateY(75vh) rotate(120deg); opacity: 0.5; }
            60%  { transform: translateY(30vh) rotate(300deg); opacity: 0.4; }
            90%  { opacity: 0.25; }
            100% { transform: translateY(-10vh) rotate(480deg); opacity: 0; }
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            padding: 50px 20px 30px;
        }
        .header .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .header .ornament .bar {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d81b60, transparent);
        }
        .header .ornament .dot {
            width: 7px;
            height: 7px;
            background: #f48fb1;
            transform: rotate(45deg);
            border-radius: 1px;
        }
        .header h1 {
            font-size: 44px;
            font-weight: 700;
            background: linear-gradient(135deg, #7c4dff, #d81b60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 8px;
        }
        .header .subtitle {
            margin-top: 12px;
            font-size: 15px;
            color: #b09cb8;
            letter-spacing: 4px;
            font-weight: 300;
        }
        .header .divider {
            width: 100px;
            height: 2px;
            margin: 22px auto 0;
            background: linear-gradient(90deg, #b39ddb, #f48fb1, #81d4fa);
            border-radius: 2px;
        }

        /* ===== 标签导航 ===== */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 36px 0 30px;
        }
        .tab-btn {
            padding: 12px 32px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.55);
            color: #7a5c8c;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 12px rgba(150, 100, 180, 0.08);
            letter-spacing: 2px;
        }
        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(150, 100, 180, 0.18);
            background: rgba(255, 255, 255, 0.75);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #b39ddb, #f48fb1);
            color: #fff;
            box-shadow: 0 4px 20px rgba(180, 130, 210, 0.30);
        }

        .tab-content { display: none; animation: fadeUp 0.5s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== 卡片网格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 24px rgba(150, 100, 180, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.50);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 36px rgba(150, 100, 180, 0.16);
            border-color: rgba(244, 143, 177, 0.35);
        }
        .card .icon { font-size: 32px; margin-bottom: 10px; }
        .card h3 { font-size: 18px; font-weight: 700; color: #3d2c4a; margin-bottom: 6px; }
        .card p { font-size: 14px; color: #8a7a9a; line-height: 1.6; }

        /* ===== 关于页面 ===== */
        .about-card {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 44px 36px;
            box-shadow: 0 4px 24px rgba(150, 100, 180, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.50);
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }
        .about-card h2 {
            font-size: 26px;
            font-weight: 700;
            color: #3d2c4a;
            margin-bottom: 14px;
        }
        .about-card .bio {
            font-size: 15px;
            color: #7a6a8a;
            line-height: 2;
        }
        .about-card .bio .hl { color: #d81b60; font-weight: 600; }
        .about-card .divider-sm {
            width: 50px;
            height: 1px;
            margin: 20px auto 0;
            background: linear-gradient(90deg, transparent, #f48fb1, transparent);
        }

        /* ===== 底部 ===== */
        .footer {
            text-align: center;
            padding: 40px 20px 20px;
            color: #c0b0cc;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        @media (max-width: 640px) {
            .header h1 { font-size: 30px; letter-spacing: 5px; }
            .tabs { flex-direction: column; align-items: center; gap: 10px; }
            .tab-btn { width: 200px; }
            .about-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- 渐变背景 -->
    <div class="bg-gradient"></div>

    <!-- 星空 Canvas -->
    <canvas id="star-canvas"></canvas>

    <!-- 玫瑰花瓣 -->
    <div class="floating-petals">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
    </div>

    <div class="container">

        <header class="header">
            <div class="ornament">
                <span class="bar"></span>
                <span class="dot"></span>
                <span class="bar"></span>
            </div>
            <h1>双鱼小栈</h1>
            <p class="subtitle">— 收藏美好 · 静待花开 —</p>
            <div class="divider"></div>
        </header>

        <nav class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="tools">🧰 常用工具</button>
            <button class="tab-btn" data-tab="study">📚 学习空间</button>
            <button class="tab-btn" data-tab="about">🌸 关于</button>
        </nav>

        <section class="tab-content active" id="tab-tools"><div class="grid" id="tools-grid"></div></section>
        <section class="tab-content" id="tab-study"><div class="grid" id="study-grid"></div></section>

        <section class="tab-content" id="tab-about">
            <div class="about-card">
                <h2>关于双鱼小栈</h2>
                <p class="bio">
                    这里是 <span class="hl">Jacky</span> 的小小收藏馆。<br>
                    喜欢把实用的工具和有趣的知识<br>像花瓣一样一片片收集起来。<br><br>
                    愿来到这里的你，也能找到属于你的那片花瓣
                </p>
                <div class="divider-sm"></div>
            </div>
        </section>

        <footer class="footer">Made with love by Jacky · 双鱼小栈</footer>
    </div>

    <!-- ============================================================ -->
    <!--  JS: 星空 + 双鱼座星座
    <!-- ============================================================ -->
    <script>
        // ================================================================
        //  数据
        // ================================================================
        const tools = [
            { icon: '🔍', name: 'Google',        desc: '全球最大的搜索引擎',    url: 'https://www.google.com' },
            { icon: '📦', name: 'GitHub',         desc: '代码托管与开源社区',    url: 'https://github.com' },
            { icon: '🤖', name: 'ChatGPT',        desc: 'OpenAI 人工智能助手',  url: 'https://chat.openai.com' },
            { icon: '🎨', name: 'Canva',           desc: '在线设计工具',        url: 'https://www.canva.com' },
            { icon: '📝', name: 'Notion',          desc: '多功能笔记与知识库',   url: 'https://www.notion.so' },
            { icon: '🌤', name: '中国天气网',      desc: '实时天气预报',         url: 'https://www.weather.com.cn' },
        ];
        const study = [
            { icon: '📖', name: 'MDN Web 文档',   desc: '前端开发权威参考手册',  url: 'https://developer.mozilla.org/zh-CN/' },
            { icon: '🐍', name: 'Python 官方教程', desc: 'Python 入门到进阶',    url: 'https://docs.python.org/zh-cn/3/tutorial/' },
            { icon: '🎓', name: '菜鸟教程',        desc: '编程基础教程大全',     url: 'https://www.runoob.com' },
            { icon: '📊', name: 'Kaggle',          desc: '数据科学 & 机器学习',  url: 'https://www.kaggle.com' },
            { icon: '🌐', name: 'W3Schools',       desc: 'Web 开发在线教程',     url: 'https://www.w3schools.com' },
            { icon: '📺', name: 'Bilibili',        desc: '视频学习平台',         url: 'https://www.bilibili.com' },
        ];

        function renderCards(id, data) {
            const g = document.getElementById(id);
            if (!data || !data.length) {
                g.innerHTML = `<div class="empty-state"><div style="font-size:48px;margin-bottom:12px">🌸</div><p>还没有内容～</p></div>`;
                return;
            }
            g.innerHTML = data.map(d =>
                `<div class="card" onclick="window.open('${d.url}','_blank')">
                    <div class="icon">${d.icon}</div>
                    <h3>${d.name}</h3>
                    <p>${d.desc}</p>
                </div>`
            ).join('');
        }
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });
        renderCards('tools-grid', tools);
        renderCards('study-grid', study);

        // ================================================================
        //  星空 & 双鱼座星座 (Canvas)
        // ================================================================
        (function() {
            const canvas = document.getElementById('star-canvas');
            const ctx = canvas.getContext('2d');

            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // --- 星星 ---
            const STARS_COUNT = 120;
            const stars = [];

            // 生成随机星星
            for (let i = 0; i < STARS_COUNT; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 1.8 + 0.5,
                    alpha: Math.random() * 0.5 + 0.2,
                    speed: Math.random() * 0.008 + 0.004,
                    phase: Math.random() * Math.PI * 2,
                });
            }

            // --- 双鱼座星座 ---
            // 定义星座关键点 (归一化坐标 0-1)
            // Pisces 风格化: 两条弧线 + 中间连接点
            const constellationRaw = [
                // 第一条鱼 (左) - 从尾巴到头部
                { x: 0.18, y: 0.55 },  // 尾巴
                { x: 0.22, y: 0.48 },
                { x: 0.28, y: 0.42 },
                { x: 0.34, y: 0.40 },  // 身体
                { x: 0.38, y: 0.43 },
                { x: 0.36, y: 0.48 },  // 头
                // 连接点 (双鱼座连线的结)
                { x: 0.40, y: 0.52 },
                // 第二条鱼 (右) - 从头部到尾巴
                { x: 0.44, y: 0.56 },  // 头
                { x: 0.48, y: 0.53 },
                { x: 0.54, y: 0.50 },  // 身体
                { x: 0.60, y: 0.48 },
                { x: 0.66, y: 0.50 },
                { x: 0.70, y: 0.55 },  // 尾巴
                // 额外装饰星
                { x: 0.15, y: 0.62 },
                { x: 0.72, y: 0.48 },
            ];

            let constellation = constellationRaw.map(p => ({
                x: p.x * W,
                y: p.y * H,
                baseX: p.x,
                baseY: p.y,
            }));

            // 连线
            const constellationEdges = [
                [0, 1], [1, 2], [2, 3], [3, 4], [4, 5],       // 左鱼
                [5, 6],                                          // 连接到结
                [6, 7],                                          // 结到右鱼
                [7, 8], [8, 9], [9, 10], [10, 11],               // 右鱼
                [5, 13], [11, 14],                                 // 额外装饰线
            ];

            // 跟随窗口缩放
            function updateConstellation() {
                constellation = constellationRaw.map(p => ({
                    x: p.x * W,
                    y: p.y * H,
                    baseX: p.x,
                    baseY: p.y,
                }));
            }
            window.addEventListener('resize', updateConstellation);

            // --- 绘制 ---
            let time = 0;

            function draw() {
                ctx.clearRect(0, 0, W, H);
                time++;

                // 1. 绘制背景星星 (闪烁)
                for (const s of stars) {
                    const twinkle = Math.sin(time * s.speed + s.phase) * 0.3 + 0.7;
                    const a = s.alpha * twinkle;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
                    ctx.fill();
                }

                // 2. 绘制星座连线
                const lineAlpha = 0.20;
                ctx.lineWidth = 1.2;
                ctx.setLineDash([]);
                for (const [i, j] of constellationEdges) {
                    const p1 = constellation[i];
                    const p2 = constellation[j];
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `rgba(179, 157, 219, ${lineAlpha})`;
                    ctx.stroke();
                }

                // 3. 绘制星座星星 (带光晕)
                for (let i = 0; i < constellation.length; i++) {
                    const s = constellation[i];
                    const isKnot = (i === 6);  // 中间连接结
                    const isExtra = (i >= 13); // 装饰星
                    const size = isKnot ? 4 : isExtra ? 2 : 3;
                    const glow = isKnot ? 12 : isExtra ? 4 : 6;

                    // 光晕
                    const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, glow);
                    grad.addColorStop(0, 'rgba(244, 143, 177, 0.25)');
                    grad.addColorStop(1, 'rgba(244, 143, 177, 0)');
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, glow, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // 星点
                    const pulse = Math.sin(time * 0.02 + i * 0.5) * 0.2 + 0.8;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, size, 0, Math.PI * 2);
                    ctx.fillStyle = isKnot
                        ? `rgba(244, 143, 177, ${0.9 * pulse})`
                        : `rgba(210, 180, 230, ${0.7 * pulse})`;
                    ctx.fill();

                    // 结星额外高光
                    if (isKnot) {
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, size * 0.4, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${0.6 * pulse})`;
                        ctx.fill();
                    }
                }

                // 4. 绘制星座标签 "Pisces"
                const last = constellation[11];
                ctx.font = '11px "Segoe UI", sans-serif';
                ctx.fillStyle = 'rgba(179, 157, 219, 0.35)';
                ctx.textAlign = 'left';
                ctx.fillText('♓ Pisces', last.x + 10, last.y + 4);

                requestAnimationFrame(draw);
            }

            draw();

            // 窗口缩放时重新分布背景星星
            window.addEventListener('resize', () => {
                for (const s of stars) {
                    s.x = Math.random() * W;
                    s.y = Math.random() * H;
                }
            });
        })();
    </script>
</body>
</html>
