<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双鱼小栈</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            color: #3d2c4a;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 渐变背景 ===== */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            background: linear-gradient(145deg, #ede4f7 0%, #fce4ec 35%, #e3f2fd 65%, #f3e5f5 100%);
            background-attachment: fixed;
        }

        /* ===== Canvas 星空层 ===== */
        #star-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* ===== 玫瑰花瓣 ===== */
        .floating-petals {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            width: 20px; height: 24px;
            border-radius: 50% 0 50% 0;
            opacity: 0;
            animation: floatPetal linear infinite;
        }
        .petal:nth-child(1)  { left: 5%;  width: 14px; height: 16px; animation-duration: 18s; animation-delay: 0s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #ec407a); }
        .petal:nth-child(2)  { left: 15%; width: 20px; height: 22px; animation-duration: 22s; animation-delay: 3s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #d81b60); }
        .petal:nth-child(3)  { left: 28%; width: 12px; height: 14px; animation-duration: 17s; animation-delay: 5s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #f06292); }
        .petal:nth-child(4)  { left: 40%; width: 24px; height: 26px; animation-duration: 24s; animation-delay: 1s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #e91e63); }
        .petal:nth-child(5)  { left: 52%; width: 16px; height: 18px; animation-duration: 19s; animation-delay: 7s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #d81b60); }
        .petal:nth-child(6)  { left: 62%; width: 22px; height: 24px; animation-duration: 21s; animation-delay: 4s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #f06292); }
        .petal:nth-child(7)  { left: 75%; width: 14px; height: 16px; animation-duration: 20s; animation-delay: 2s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #ec407a); }
        .petal:nth-child(8)  { left: 85%; width: 20px; height: 22px; animation-duration: 16s; animation-delay: 6s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #d81b60); }
        .petal:nth-child(9)  { left: 48%; width: 18px; height: 20px; animation-duration: 25s; animation-delay: 9s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #f06292); }
        .petal:nth-child(10) { left: 92%; width: 15px; height: 17px; animation-duration: 18s; animation-delay: 8s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #e91e63); }
        .petal:nth-child(11) { left: 22%; width: 19px; height: 21px; animation-duration: 23s; animation-delay: 10s; background: radial-gradient(circle at 30% 30%, #f8bbd0, #d81b60); }
        .petal:nth-child(12) { left: 68%; width: 13px; height: 15px; animation-duration: 20s; animation-delay: 11s; background: radial-gradient(circle at 30% 30%, #f48fb1, #f06292); }
        @keyframes floatPetal {
            0%   { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            8%   { opacity: 0.45; }
            20%  { transform: translateY(75vh) rotate(120deg); opacity: 0.5; }
            60%  { transform: translateY(30vh) rotate(300deg); opacity: 0.4; }
            90%  { opacity: 0.2; }
            100% { transform: translateY(-10vh) rotate(480deg); opacity: 0; }
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            padding: 50px 20px 30px;
        }
        .header .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .header .ornament .bar {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d81b60, transparent);
        }
        .header .ornament .dot {
            width: 7px; height: 7px;
            background: #f48fb1;
            transform: rotate(45deg);
            border-radius: 1px;
        }
        .header h1 {
            font-size: 44px;
            font-weight: 700;
            background: linear-gradient(135deg, #7c4dff, #d81b60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 8px;
        }
        .header .subtitle {
            margin-top: 12px;
            font-size: 15px;
            color: #b09cb8;
            letter-spacing: 4px;
            font-weight: 300;
        }
        .header .divider {
            width: 100px;
            height: 2px;
            margin: 22px auto 0;
            background: linear-gradient(90deg, #b39ddb, #f48fb1, #81d4fa);
            border-radius: 2px;
        }

        /* ===== 标签 ===== */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 36px 0 30px;
        }
        .tab-btn {
            padding: 12px 32px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.55);
            color: #7a5c8c;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 12px rgba(150, 100, 180, 0.08);
            letter-spacing: 2px;
        }
        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(150, 100, 180, 0.18);
            background: rgba(255, 255, 255, 0.75);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #b39ddb, #f48fb1);
            color: #fff;
            box-shadow: 0 4px 20px rgba(180, 130, 210, 0.30);
        }

        .tab-content { display: none; animation: fadeUp 0.5s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== 卡片 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 24px rgba(150, 100, 180, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.50);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 36px rgba(150, 100, 180, 0.16);
            border-color: rgba(244, 143, 177, 0.35);
        }
        .card .icon { font-size: 32px; margin-bottom: 10px; }
        .card h3 { font-size: 18px; font-weight: 700; color: #3d2c4a; margin-bottom: 6px; }
        .card p { font-size: 14px; color: #8a7a9a; line-height: 1.6; }

        /* ===== 关于 ===== */
        .about-card {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 44px 36px;
            box-shadow: 0 4px 24px rgba(150, 100, 180, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.50);
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }
        .about-card h2 { font-size: 26px; font-weight: 700; color: #3d2c4a; margin-bottom: 14px; }
        .about-card .bio { font-size: 15px; color: #7a6a8a; line-height: 2; }
        .about-card .bio .hl { color: #d81b60; font-weight: 600; }
        .about-card .divider-sm {
            width: 50px; height: 1px;
            margin: 20px auto 0;
            background: linear-gradient(90deg, transparent, #f48fb1, transparent);
        }

        .footer {
            text-align: center;
            padding: 40px 20px 20px;
            color: #c0b0cc;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        @media (max-width: 640px) {
            .header h1 { font-size: 30px; letter-spacing: 5px; }
            .tabs { flex-direction: column; align-items: center; gap: 10px; }
            .tab-btn { width: 200px; }
            .about-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <canvas id="star-canvas"></canvas>

    <div class="floating-petals">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="ornament">
                <span class="bar"></span>
                <span class="dot"></span>
                <span class="bar"></span>
            </div>
            <h1>双鱼小栈</h1>
            <p class="subtitle">— 收藏美好 · 静待花开 —</p>
            <div class="divider"></div>
        </header>

        <nav class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="tools">🧰 常用工具</button>
            <button class="tab-btn" data-tab="study">📚 学习空间</button>
            <button class="tab-btn" data-tab="about">🌸 关于</button>
        </nav>

        <section class="tab-content active" id="tab-tools"><div class="grid" id="tools-grid"></div></section>
        <section class="tab-content" id="tab-study"><div class="grid" id="study-grid"></div></section>

        <section class="tab-content" id="tab-about">
            <div class="about-card">
                <h2>关于双鱼小栈</h2>
                <p class="bio">
                    这里是 <span class="hl">Jacky</span> 的小小收藏馆。<br>
                    喜欢把实用的工具和有趣的知识<br>像花瓣一样一片片收集起来。<br><br>
                    愿来到这里的你，也能找到属于你的那片花瓣
                </p>
                <div class="divider-sm"></div>
            </div>
        </section>

        <footer class="footer">Made with love by Jacky · 双鱼小栈</footer>
    </div>

    <script>
        // ================================================================
        //  数据
        // ================================================================
        const tools = [
            { icon: '🔍', name: 'Google',        desc: '全球最大的搜索引擎',    url: 'https://www.google.com' },
            { icon: '📦', name: 'GitHub',         desc: '代码托管与开源社区',    url: 'https://github.com' },
            { icon: '🤖', name: 'ChatGPT',        desc: 'OpenAI 人工智能助手',  url: 'https://chat.openai.com' },
            { icon: '🎨', name: 'Canva',           desc: '在线设计工具',        url: 'https://www.canva.com' },
            { icon: '📝', name: 'Notion',          desc: '多功能笔记与知识库',   url: 'https://www.notion.so' },
            { icon: '🌤', name: '中国天气网',      desc: '实时天气预报',         url: 'https://www.weather.com.cn' },
        ];
        const study = [
            { icon: '📖', name: 'MDN Web 文档',   desc: '前端开发权威参考手册',  url: 'https://developer.mozilla.org/zh-CN/' },
            { icon: '🐍', name: 'Python 官方教程', desc: 'Python 入门到进阶',    url: 'https://docs.python.org/zh-cn/3/tutorial/' },
            { icon: '🎓', name: '菜鸟教程',        desc: '编程基础教程大全',     url: 'https://www.runoob.com' },
            { icon: '📊', name: 'Kaggle',          desc: '数据科学 & 机器学习',  url: 'https://www.kaggle.com' },
            { icon: '🌐', name: 'W3Schools',       desc: 'Web 开发在线教程',     url: 'https://www.w3schools.com' },
            { icon: '📺', name: 'Bilibili',        desc: '视频学习平台',         url: 'https://www.bilibili.com' },
        ];

        function renderCards(id, data) {
            const g = document.getElementById(id);
            if (!data || !data.length) {
                g.innerHTML = '<div class="empty-state"><div style="font-size:48px;margin-bottom:12px">🌸</div><p>还没有内容～</p></div>';
                return;
            }
            g.innerHTML = data.map(d =>
                `<div class="card" onclick="window.open('${d.url}','_blank')">
                    <div class="icon">${d.icon}</div>
                    <h3>${d.name}</h3>
                    <p>${d.desc}</p>
                </div>`
            ).join('');
        }
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });
        renderCards('tools-grid', tools);
        renderCards('study-grid', study);

        // ================================================================
        //  星空 & 双鱼座星座 (Canvas)
        // ================================================================
        (function() {
            const canvas = document.getElementById('star-canvas');
            const ctx = canvas.getContext('2d');

            let W, H;
            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // ------------------------------------------------------------
            //  1. 背景星星 —— 每颗都有自己的闪烁节奏
            // ------------------------------------------------------------
            const STARS = 160;
            const stars = [];
            for (let i = 0; i < STARS; i++) {
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 2.0 + 0.4,
                    baseAlpha: Math.random() * 0.4 + 0.15,
                    // 两层不同频率的波，制造自然闪烁
                    speed1: Math.random() * 0.015 + 0.005,
                    speed2: Math.random() * 0.025 + 0.010,
                    phase1: Math.random() * Math.PI * 2,
                    phase2: Math.random() * Math.PI * 2,
                    // 闪烁深度: 0.3=微微闪, 0.9=大幅闪
                    depth: Math.random() * 0.6 + 0.2,
                });
            }

            // ------------------------------------------------------------
            //  2. 双鱼座星座
            // ------------------------------------------------------------
            // 归一化坐标 (0-1)，随窗口自适应
            const pts = [
                // 左鱼 (尾巴 → 头)
                { x: 0.16, y: 0.58 },
                { x: 0.20, y: 0.50 },
                { x: 0.26, y: 0.44 },
                { x: 0.32, y: 0.41 },
                { x: 0.37, y: 0.44 },
                { x: 0.35, y: 0.50 },
                // 结星 (连接点)
                { x: 0.40, y: 0.54 },
                // 右鱼 (头 → 尾巴)
                { x: 0.45, y: 0.57 },
                { x: 0.50, y: 0.53 },
                { x: 0.56, y: 0.50 },
                { x: 0.62, y: 0.49 },
                { x: 0.68, y: 0.52 },
                { x: 0.72, y: 0.57 },
                // 装饰星
                { x: 0.13, y: 0.65 },
                { x: 0.75, y: 0.50 },
            ];

            let cst; // 当前像素坐标
            function updateCst() {
                cst = pts.map(p => ({ x: p.x * W, y: p.y * H }));
            }
            window.addEventListener('resize', updateCst);
            updateCst();

            // 连线定义: [起点下标, 终点下标, 组别]
            // 组别用来控制不同区域不同步呼吸
            const edges = [
                [0, 1, 0], [1, 2, 0], [2, 3, 0], [3, 4, 0], [4, 5, 0],
                [5, 6, 2],
                [6, 7, 1],
                [7, 8, 1], [8, 9, 1], [9, 10, 1], [10, 11, 1],
                [5, 13, 0], [11, 14, 1],
            ];
            // 每组的呼吸相位
            const groupPhases = [0, 2.1, 4.0];

            // 每颗星座星的闪烁参数
            const starParams = pts.map((_, i) => ({
                speed: 0.012 + Math.random() * 0.012,
                phase: Math.random() * Math.PI * 2,
                depth: 0.35 + Math.random() * 0.35,
            }));

            // ------------------------------------------------------------
            //  3. 主循环
            // ------------------------------------------------------------
            let frame = 0;

            function draw() {
                ctx.clearRect(0, 0, W, H);
                frame++;

                // ---------- 2a. 背景星星 ----------
                for (const s of stars) {
                    // 用两层正弦波叠加，产生不规则闪烁
                    const w1 = Math.sin(frame * s.speed1 + s.phase1);
                    const w2 = Math.sin(frame * s.speed2 + s.phase2) * 0.35;
                    const twinkle = (w1 + w2) * s.depth * 0.5 + (1 - s.depth * 0.5);
                    const alpha = s.baseAlpha * Math.max(0.05, twinkle);

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                    ctx.fill();
                }

                // ---------- 2b. 星座连线 (不同步呼吸) ----------
                for (const [i, j, group] of edges) {
                    const p1 = cst[i];
                    const p2 = cst[j];
                    // 每条线独立呼吸：基础透明度 + 随帧变化的波动
                    const breath = Math.sin(frame * 0.006 + groupPhases[group] + i * 0.3) * 0.5 + 0.5;
                    const lineAlpha = 0.06 + breath * 0.18;

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `rgba(190, 160, 220, ${lineAlpha})`;
                    ctx.lineWidth = 1.0 + breath * 0.6;
                    ctx.stroke();
                }

                // ---------- 2c. 星座星星 ----------
                for (let i = 0; i < cst.length; i++) {
                    const p = cst[i];
                    const sp = starParams[i];
                    const isKnot = (i === 6);
                    const isExtra = (i >= 13);

                    // 每颗星独立闪烁
                    const twinkle = Math.sin(frame * sp.speed + sp.phase) * sp.depth * 0.5 + (1 - sp.depth * 0.5);
                    const a = Math.max(0.2, twinkle);

                    const size = isKnot ? 4.5 : isExtra ? 2.0 : 3.2;
                    const glowR = isKnot ? 22 : isExtra ? 6 : 12;

                    // 外光晕 (跟随闪烁)
                    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
                    const glowAlpha = isKnot ? 0.20 : 0.12;
                    grad.addColorStop(0, `rgba(220, 180, 230, ${glowAlpha * a})`);
                    grad.addColorStop(1, `rgba(220, 180, 230, 0)`);
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    // 内核 (白色/粉色)
                    const hue = isKnot ? 240 : 210;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size * a, 0, Math.PI * 2);
                    ctx.fillStyle = isKnot
                        ? `rgba(244, 143, 177, ${0.85 * a})`
                        : `rgba(210, 185, 235, ${0.7 * a})`;
                    ctx.fill();

                    // 结星高光内核
                    if (isKnot) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, size * 0.35, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${0.7 * a})`;
                        ctx.fill();
                    }
                }

                // ---------- 2d. 星座名称 ----------
                const label = cst[11];
                const labelBlink = Math.sin(frame * 0.008) * 0.5 + 0.5;
                ctx.font = '12px "Segoe UI", sans-serif';
                ctx.fillStyle = `rgba(170, 150, 200, ${0.15 + labelBlink * 0.25})`;
                ctx.textAlign = 'left';
                ctx.fillText('♓ Pisces', label.x + 12, label.y + 5);

                requestAnimationFrame(draw);
            }

            draw();

            // 窗口缩放时重新分布背景星星
            window.addEventListener('resize', () => {
                for (const s of stars) {
                    s.x = Math.random() * W;
                    s.y = Math.random() * H;
                }
            });
        })();
    </script>
</body>
</html>
