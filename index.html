<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双鱼小栈</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            color: #3d2c4a;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 渐变背景 ===== */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            background: linear-gradient(145deg, #ede4f7 0%, #fce4ec 35%, #e3f2fd 65%, #f3e5f5 100%);
            background-attachment: fixed;
        }

        /* ===== Canvas 星空层 ===== */
        #star-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* ===== 玫瑰花瓣 ===== */
        .floating-petals {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            width: 20px; height: 24px;
            border-radius: 50% 0 50% 0;
            opacity: 0;
            animation: floatPetal linear infinite;
        }
        .petal {
            position: absolute;
            width: 20px; height: 24px;
            border-radius: 50% 0 50% 0;
            opacity: 0;
            animation: fallPetal linear infinite;
        }
        .petal:nth-child(1)  { left: 5%;  width: 16px; height: 18px; animation-duration: 28s; animation-delay: 0s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #ec407a); }
        .petal:nth-child(2)  { left: 15%; width: 22px; height: 24px; animation-duration: 32s; animation-delay: 5s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #d81b60); }
        .petal:nth-child(3)  { left: 28%; width: 14px; height: 16px; animation-duration: 26s; animation-delay: 8s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #f06292); }
        .petal:nth-child(4)  { left: 40%; width: 26px; height: 28px; animation-duration: 34s; animation-delay: 2s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #e91e63); }
        .petal:nth-child(5)  { left: 52%; width: 18px; height: 20px; animation-duration: 29s; animation-delay: 10s; background: radial-gradient(circle at 30% 30%, #f8bbd0, #d81b60); }
        .petal:nth-child(6)  { left: 62%; width: 24px; height: 26px; animation-duration: 31s; animation-delay: 6s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #f06292); }
        .petal:nth-child(7)  { left: 75%; width: 16px; height: 18px; animation-duration: 27s; animation-delay: 3s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #ec407a); }
        .petal:nth-child(8)  { left: 85%; width: 22px; height: 24px; animation-duration: 33s; animation-delay: 9s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #d81b60); }
        .petal:nth-child(9)  { left: 48%; width: 20px; height: 22px; animation-duration: 36s; animation-delay: 12s; background: radial-gradient(circle at 30% 30%, #f8bbd0, #f06292); }
        .petal:nth-child(10) { left: 92%; width: 17px; height: 19px; animation-duration: 25s; animation-delay: 7s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #e91e63); }
        .petal:nth-child(11) { left: 22%; width: 21px; height: 23px; animation-duration: 30s; animation-delay: 14s; background: radial-gradient(circle at 30% 30%, #f8bbd0, #d81b60); }
        .petal:nth-child(12) { left: 68%; width: 15px; height: 17px; animation-duration: 35s; animation-delay: 11s; background: radial-gradient(circle at 30% 30%, #f48fb1, #f06292); }
        @keyframes fallPetal {
            0%   { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10%  { opacity: 0.5; }
            30%  { transform: translateY(25vh) rotate(180deg); opacity: 0.55; }
            60%  { transform: translateY(55vh) rotate(320deg); opacity: 0.4; }
            85%  { opacity: 0.2; }
            100% { transform: translateY(110vh) rotate(480deg); opacity: 0; }
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            padding: 50px 20px 30px;
        }
        .header .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .header .ornament .bar {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d81b60, transparent);
        }
        .header .ornament .dot {
            width: 7px; height: 7px;
            background: #f48fb1;
            transform: rotate(45deg);
            border-radius: 1px;
        }
        .header h1 {
            font-size: 44px;
            font-weight: 700;
            background: linear-gradient(135deg, #7c4dff, #d81b60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 8px;
        }
        .header .subtitle {
            margin-top: 12px;
            font-size: 15px;
            color: #b09cb8;
            letter-spacing: 4px;
            font-weight: 300;
        }
        .header .divider {
            width: 100px;
            height: 2px;
            margin: 22px auto 0;
            background: linear-gradient(90deg, #b39ddb, #f48fb1, #81d4fa);
            border-radius: 2px;
        }

        /* ===== 标签 ===== */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 36px 0 30px;
        }
        .tab-btn {
            padding: 12px 32px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.55);
            color: #7a5c8c;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 12px rgba(150, 100, 180, 0.08);
            letter-spacing: 2px;
        }
        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(150, 100, 180, 0.18);
            background: rgba(255, 255, 255, 0.75);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #b39ddb, #f48fb1);
            color: #fff;
            box-shadow: 0 4px 20px rgba(180, 130, 210, 0.30);
        }

        .tab-content { display: none; animation: fadeUp 0.5s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== 卡片 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 24px rgba(150, 100, 180, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.50);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 36px rgba(150, 100, 180, 0.16);
            border-color: rgba(244, 143, 177, 0.35);
        }
        .card .icon { font-size: 32px; margin-bottom: 10px; }
        .card h3 { font-size: 18px; font-weight: 700; color: #3d2c4a; margin-bottom: 6px; }
        .card p { font-size: 14px; color: #8a7a9a; line-height: 1.6; }

        /* ===== 关于 ===== */
        .about-card {
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 44px 36px;
            box-shadow: 0 4px 24px rgba(150, 100, 180, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.50);
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }
        .about-card h2 { font-size: 26px; font-weight: 700; color: #3d2c4a; margin-bottom: 14px; }
        .about-card .bio { font-size: 15px; color: #7a6a8a; line-height: 2; }
        .about-card .bio .hl { color: #d81b60; font-weight: 600; }
        .about-card .divider-sm {
            width: 50px; height: 1px;
            margin: 20px auto 0;
            background: linear-gradient(90deg, transparent, #f48fb1, transparent);
        }

        .footer {
            text-align: center;
            padding: 40px 20px 20px;
            color: #c0b0cc;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        @media (max-width: 640px) {
            .header h1 { font-size: 30px; letter-spacing: 5px; }
            .tabs { flex-direction: column; align-items: center; gap: 10px; }
            .tab-btn { width: 200px; }
            .about-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <canvas id="star-canvas"></canvas>

    <div class="floating-petals">
        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
        <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="ornament">
                <span class="bar"></span>
                <span class="dot"></span>
                <span class="bar"></span>
            </div>
            <h1>双鱼小栈</h1>
            <p class="subtitle">— 收藏美好 · 静待花开 —</p>
            <div class="divider"></div>
        </header>

        <nav class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="tools">🧰 常用工具</button>
            <button class="tab-btn" data-tab="study">📚 学习空间</button>
            <button class="tab-btn" data-tab="about">🌸 关于</button>
        </nav>

        <section class="tab-content active" id="tab-tools"><div class="grid" id="tools-grid"></div></section>
        <section class="tab-content" id="tab-study"><div class="grid" id="study-grid"></div></section>

        <section class="tab-content" id="tab-about">
            <div class="about-card">
                <h2>关于双鱼小栈</h2>
                <p class="bio">
                    这里是 <span class="hl">Jacky</span> 的小小收藏馆。<br>
                    喜欢把实用的工具和有趣的知识<br>像花瓣一样一片片收集起来。<br><br>
                    愿来到这里的你，也能找到属于你的那片花瓣
                </p>
                <div class="divider-sm"></div>
            </div>
        </section>

        <footer class="footer">Made with love by Jacky · 双鱼小栈</footer>
    </div>

    <script>
        // ================================================================
        //  数据
        // ================================================================
        const tools = [
            { icon: '🔍', name: 'Google',        desc: '全球最大的搜索引擎',    url: 'https://www.google.com' },
            { icon: '📦', name: 'GitHub',         desc: '代码托管与开源社区',    url: 'https://github.com' },
            { icon: '🤖', name: 'ChatGPT',        desc: 'OpenAI 人工智能助手',  url: 'https://chat.openai.com' },
            { icon: '🎨', name: 'Canva',           desc: '在线设计工具',        url: 'https://www.canva.com' },
            { icon: '📝', name: 'Notion',          desc: '多功能笔记与知识库',   url: 'https://www.notion.so' },
            { icon: '🌤', name: '中国天气网',      desc: '实时天气预报',         url: 'https://www.weather.com.cn' },
        ];
        const study = [
            { icon: '📖', name: 'MDN Web 文档',   desc: '前端开发权威参考手册',  url: 'https://developer.mozilla.org/zh-CN/' },
            { icon: '🐍', name: 'Python 官方教程', desc: 'Python 入门到进阶',    url: 'https://docs.python.org/zh-cn/3/tutorial/' },
            { icon: '🎓', name: '菜鸟教程',        desc: '编程基础教程大全',     url: 'https://www.runoob.com' },
            { icon: '📊', name: 'Kaggle',          desc: '数据科学 & 机器学习',  url: 'https://www.kaggle.com' },
            { icon: '🌐', name: 'W3Schools',       desc: 'Web 开发在线教程',     url: 'https://www.w3schools.com' },
            { icon: '📺', name: 'Bilibili',        desc: '视频学习平台',         url: 'https://www.bilibili.com' },
        ];

        function renderCards(id, data) {
            const g = document.getElementById(id);
            if (!data || !data.length) {
                g.innerHTML = '<div class="empty-state"><div style="font-size:48px;margin-bottom:12px">🌸</div><p>还没有内容～</p></div>';
                return;
            }
            g.innerHTML = data.map(d =>
                `<div class="card" onclick="window.open('${d.url}','_blank')">
                    <div class="icon">${d.icon}</div>
                    <h3>${d.name}</h3>
                    <p>${d.desc}</p>
                </div>`
            ).join('');
        }
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });
        renderCards('tools-grid', tools);
        renderCards('study-grid', study);

        // ================================================================
        //  星空 & 双鱼座星座 (Canvas)
        //  关键: 在浅色背景上用深色/有色彩的星星而非白色
        // ================================================================
        (function() {
            const canvas = document.getElementById('star-canvas');
            const ctx = canvas.getContext('2d');
            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // ---- 1. 背景星星 ----
            const STARS = 200;
            const stars = [];
            // 调色板: 粉色系 + 紫色系 + 金色系, 在浅背景上可见
            const palettes = [
                [180, 120, 200],  // 淡紫
                [200, 130, 170],  // 粉紫
                [210, 150, 160],  // 粉红
                [160, 140, 210],  // 紫蓝
                [200, 160, 130],  // 香槟金
                [190, 120, 180],  // 玫紫
            ];

            for (let i = 0; i < STARS; i++) {
                const pal = palettes[Math.floor(Math.random() * palettes.length)];
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: Math.random() * 2.5 + 0.8,
                    r2: Math.random() * 0.5 + 0.2,  // 内核心大小
                    pal,
                    // 闪烁参数: 双波不同步
                    s1: Math.random() * 0.018 + 0.006,
                    s2: Math.random() * 0.030 + 0.012,
                    p1: Math.random() * Math.PI * 2,
                    p2: Math.random() * Math.PI * 2,
                    depth: Math.random() * 0.6 + 0.3,
                    baseA: Math.random() * 0.4 + 0.25,
                });
            }

            // ---- 2. 星座 ----
            const pts = [
                { x: 0.16, y: 0.58 }, { x: 0.20, y: 0.50 },
                { x: 0.26, y: 0.44 }, { x: 0.32, y: 0.41 },
                { x: 0.37, y: 0.44 }, { x: 0.35, y: 0.50 },
                { x: 0.40, y: 0.54 },  // 结星
                { x: 0.45, y: 0.57 }, { x: 0.50, y: 0.53 },
                { x: 0.56, y: 0.50 }, { x: 0.62, y: 0.49 },
                { x: 0.68, y: 0.52 }, { x: 0.72, y: 0.57 },
                { x: 0.13, y: 0.65 }, { x: 0.75, y: 0.50 },
            ];

            let cst;
            function updCst() { cst = pts.map(p => ({ x: p.x * W, y: p.y * H })); }
            updCst();
            window.addEventListener('resize', updCst);

            // 连线: [起点, 终点, 组]
            const edges = [
                [0, 1, 0], [1, 2, 0], [2, 3, 0], [3, 4, 0], [4, 5, 0],
                [5, 6, 2], [6, 7, 1],
                [7, 8, 1], [8, 9, 1], [9, 10, 1], [10, 11, 1],
                [5, 13, 0], [11, 14, 1],
            ];
            const grpPh = [0, 2.5, 4.2];

            // 星座星闪烁参数
            const cstParams = pts.map(() => ({
                speed: 0.010 + Math.random() * 0.014,
                phase: Math.random() * Math.PI * 2,
                depth: 0.3 + Math.random() * 0.4,
            }));

            // ---- 3. 渲染循环 ----
            let t = 0;

            function draw() {
                ctx.clearRect(0, 0, W, H);
                t++;

                // --- 背景星星 ---
                for (const s of stars) {
                    const w1 = Math.sin(t * s.s1 + s.p1);
                    const w2 = Math.sin(t * s.s2 + s.p2) * 0.35;
                    const tw = (w1 + w2) * s.depth * 0.45 + (1 - s.depth * 0.45);
                    const a = s.baseA * Math.max(0.08, tw);
                    const [r, g, b] = s.pal;

                    // 外光晕
                    const gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
                    gr.addColorStop(0, `rgba(${r},${g},${b},${a * 0.2})`);
                    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
                    ctx.fillStyle = gr;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
                    ctx.fill();

                    // 核心
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r * tw, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${r},${g},${b},${a * 0.9})`;
                    ctx.fill();

                    // 高光内核
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r2, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${a * 0.5})`;
                    ctx.fill();
                }

                // --- 星座连线 (每组呼吸不同步) ---
                for (const [i, j, g] of edges) {
                    const p1 = cst[i], p2 = cst[j];
                    const breath = Math.sin(t * 0.005 + grpPh[g] + i * 0.25) * 0.5 + 0.5;
                    const la = 0.08 + breath * 0.22;
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `rgba(160, 120, 200, ${la})`;
                    ctx.lineWidth = 1.0 + breath * 0.8;
                    ctx.stroke();
                }

                // --- 星座星星 ---
                for (let i = 0; i < cst.length; i++) {
                    const p = cst[i];
                    const cp = cstParams[i];
                    const isKnot = i === 6;
                    const isExtra = i >= 13;

                    const tw = Math.sin(t * cp.speed + cp.phase) * cp.depth * 0.45 + (1 - cp.depth * 0.45);
                    const a = Math.max(0.2, tw);

                    const size = isKnot ? 5.5 : isExtra ? 2.5 : 4;
                    const glowR = isKnot ? 30 : isExtra ? 8 : 18;

                    // 光晕 (玫瑰粉紫色)
                    const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
                    const ga = isKnot ? 0.25 : 0.15;
                    grd.addColorStop(0, `rgba(200, 140, 180, ${ga * a})`);
                    grd.addColorStop(1, `rgba(200, 140, 180, 0)`);
                    ctx.fillStyle = grd;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
                    ctx.fill();

                    // 内核: 结星用玫瑰红, 其他用粉紫
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, size * a, 0, Math.PI * 2);
                    ctx.fillStyle = isKnot
                        ? `rgba(220, 80, 130, ${0.85 * a})`
                        : `rgba(180, 130, 200, ${0.75 * a})`;
                    ctx.fill();

                    // 结星内高光
                    if (isKnot) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, size * 0.35, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 220, 230, ${0.8 * a})`;
                        ctx.fill();
                    }
                }

                // --- 标注 ---
                const lb = cst[11];
                const blink = Math.sin(t * 0.007) * 0.5 + 0.5;
                ctx.font = '13px "Segoe UI", sans-serif';
                ctx.fillStyle = `rgba(150, 120, 180, ${0.15 + blink * 0.35})`;
                ctx.textAlign = 'left';
                ctx.fillText('♓ Pisces', lb.x + 14, lb.y + 6);

                requestAnimationFrame(draw);
            }

            draw();

            // 窗口缩放重排背景星
            window.addEventListener('resize', () => {
                for (const s of stars) {
                    s.x = Math.random() * W;
                    s.y = Math.random() * H;
                }
            });
        })();
    </script>
</body>
</html>
