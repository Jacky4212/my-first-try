<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双鱼小栈</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            color: #e8e0f0;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== 深海渐变背景 ===== */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -2;
            background: linear-gradient(145deg, #0c0e2b 0%, #1a1040 30%, #0d1f3c 60%, #12103a 100%);
            background-attachment: fixed;
        }

        /* ===== 深海流光 ===== */
        .bg-flow {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .bg-flow::before,
        .bg-flow::after {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            border-radius: 40%;
            opacity: 0.04;
            animation: flowSpin 16s linear infinite;
        }
        .bg-flow::before {
            background: radial-gradient(ellipse at 30% 50%, #6a5acd, transparent 60%);
            animation-duration: 20s;
        }
        .bg-flow::after {
            background: radial-gradient(ellipse at 70% 50%, #cd5c7a, transparent 60%);
            animation-duration: 24s;
            animation-direction: reverse;
        }
        @keyframes flowSpin {
            0%   { transform: rotate(0deg) scale(1); }
            50%  { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* ===== Canvas 星空层 ===== */
        #star-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== 玫瑰花瓣 ===== */
        .petals {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }
        .p {
            position: absolute;
            border-radius: 50% 0 50% 0;
            opacity: 0;
            animation: fall linear infinite;
        }
        .p:nth-child(1)  { left: 5%;  width: 14px; height: 16px; animation-duration: 26s; animation-delay: 0s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #ec407a); }
        .p:nth-child(2)  { left: 15%; width: 20px; height: 22px; animation-duration: 30s; animation-delay: 4s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #d81b60); }
        .p:nth-child(3)  { left: 28%; width: 12px; height: 14px; animation-duration: 28s; animation-delay: 7s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #f06292); }
        .p:nth-child(4)  { left: 40%; width: 22px; height: 24px; animation-duration: 32s; animation-delay: 2s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #e91e63); }
        .p:nth-child(5)  { left: 52%; width: 16px; height: 18px; animation-duration: 27s; animation-delay: 9s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #d81b60); }
        .p:nth-child(6)  { left: 62%; width: 20px; height: 22px; animation-duration: 33s; animation-delay: 5s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #f06292); }
        .p:nth-child(7)  { left: 75%; width: 14px; height: 16px; animation-duration: 29s; animation-delay: 3s;  background: radial-gradient(circle at 30% 30%, #f8bbd0, #ec407a); }
        .p:nth-child(8)  { left: 85%; width: 18px; height: 20px; animation-duration: 31s; animation-delay: 8s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #d81b60); }
        .p:nth-child(9)  { left: 48%; width: 16px; height: 18px; animation-duration: 35s; animation-delay: 11s; background: radial-gradient(circle at 30% 30%, #f8bbd0, #f06292); }
        .p:nth-child(10) { left: 92%; width: 15px; height: 17px; animation-duration: 25s; animation-delay: 6s;  background: radial-gradient(circle at 30% 30%, #f48fb1, #e91e63); }
        .p:nth-child(11) { left: 22%; width: 19px; height: 21px; animation-duration: 34s; animation-delay: 12s; background: radial-gradient(circle at 30% 30%, #f8bbd0, #d81b60); }
        .p:nth-child(12) { left: 68%; width: 13px; height: 15px; animation-duration: 28s; animation-delay: 10s; background: radial-gradient(circle at 30% 30%, #f48fb1, #f06292); }
        @keyframes fall {
            0%   { transform: translateY(-8vh) rotate(0deg) translateX(0); opacity: 0; }
            10%  { opacity: 0.5; }
            30%  { transform: translateY(20vh) rotate(150deg) translateX(15px); opacity: 0.55; }
            60%  { transform: translateY(55vh) rotate(300deg) translateX(-10px); opacity: 0.35; }
            85%  { opacity: 0.15; }
            100% { transform: translateY(108vh) rotate(480deg) translateX(5px); opacity: 0; }
        }

        /* ===== 主容器 ===== */
        .container {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        /* ===== 头部 ===== */
        .header {
            text-align: center;
            padding: 50px 20px 30px;
        }
        .header .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .header .ornament .bar {
            width: 50px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #f48fb1, transparent);
        }
        .header .ornament .dot {
            width: 7px; height: 7px;
            background: #f48fb1;
            transform: rotate(45deg);
            border-radius: 1px;
            box-shadow: 0 0 8px rgba(244, 143, 177, 0.5);
        }
        .header h1 {
            font-size: 44px;
            font-weight: 700;
            background: linear-gradient(135deg, #b39ddb, #f48fb1, #81d4fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 8px;
        }
        .header .subtitle {
            margin-top: 12px;
            font-size: 15px;
            color: #8a7aaa;
            letter-spacing: 4px;
            font-weight: 300;
        }
        .header .divider {
            width: 100px;
            height: 2px;
            margin: 22px auto 0;
            background: linear-gradient(90deg, transparent, #f48fb1, transparent);
            border-radius: 2px;
        }

        /* ===== 标签 ===== */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 36px 0 30px;
        }
        .tab-btn {
            padding: 12px 32px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.06);
            color: #b8a0cc;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 2px;
        }
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(244, 143, 177, 0.2);
        }
        .tab-btn.active {
            background: linear-gradient(135deg, rgba(120, 80, 180, 0.4), rgba(200, 60, 120, 0.3));
            border-color: rgba(244, 143, 177, 0.3);
            color: #e8d8f0;
            box-shadow: 0 4px 20px rgba(150, 80, 180, 0.15);
        }

        .tab-content { display: none; animation: fadeUp 0.5s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== 卡片 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(244, 143, 177, 0.2);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 30px rgba(100, 60, 160, 0.15);
        }
        .card .icon { font-size: 28px; margin-bottom: 8px; }
        .card h3 { font-size: 17px; font-weight: 600; color: #e0d0e8; margin-bottom: 4px; }
        .card p  { font-size: 13px; color: #8a7aaa; line-height: 1.6; }

        /* ===== 关于 ===== */
        .about-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 44px 36px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
        }
        .about-card h2 { font-size: 26px; font-weight: 700; color: #e0d0e8; margin-bottom: 14px; }
        .about-card .bio { font-size: 15px; color: #a090b8; line-height: 2; }
        .about-card .bio .hl { color: #f48fb1; font-weight: 600; }
        .about-card .divider-sm {
            width: 50px; height: 1px;
            margin: 20px auto 0;
            background: linear-gradient(90deg, transparent, #f48fb1, transparent);
        }

        .footer {
            text-align: center;
            padding: 40px 20px 20px;
            color: #6a5a80;
            font-size: 13px;
            letter-spacing: 2px;
        }

        @media (max-width: 640px) {
            .header h1 { font-size: 30px; letter-spacing: 5px; }
            .tabs { flex-direction: column; align-items: center; gap: 10px; }
            .tab-btn { width: 200px; }
            .about-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="bg-flow"></div>
    <canvas id="star-canvas"></canvas>

    <div class="petals">
        <div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div>
        <div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div>
        <div class="p"></div><div class="p"></div><div class="p"></div><div class="p"></div>
    </div>

    <div class="container">
        <header class="header">
            <div class="ornament">
                <span class="bar"></span>
                <span class="dot"></span>
                <span class="bar"></span>
            </div>
            <h1>双鱼小栈</h1>
            <p class="subtitle">— 收藏美好 · 静待花开 —</p>
            <div class="divider"></div>
        </header>

        <nav class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="tools">🧰 常用工具</button>
            <button class="tab-btn" data-tab="study">📚 学习空间</button>
            <button class="tab-btn" data-tab="about">🌸 关于</button>
        </nav>

        <section class="tab-content active" id="tab-tools"><div class="grid" id="tools-grid"></div></section>
        <section class="tab-content" id="tab-study"><div class="grid" id="study-grid"></div></section>

        <section class="tab-content" id="tab-about">
            <div class="about-card">
                <h2>关于双鱼小栈</h2>
                <p class="bio">
                    这里是 <span class="hl">Jacky</span> 的小小收藏馆。<br>
                    喜欢把实用的工具和有趣的知识<br>像花瓣一样一片片收集起来。<br><br>
                    愿来到这里的你，也能找到属于你的那片花瓣
                </p>
                <div class="divider-sm"></div>
            </div>
        </section>

        <footer class="footer">Made with love by Jacky · 双鱼小栈</footer>
    </div>

    <script>
        // ================================================================
        //  数据
        // ================================================================
        const tools = [
            { icon: '🔍', name: 'Google',        desc: '全球最大的搜索引擎',    url: 'https://www.google.com' },
            { icon: '📦', name: 'GitHub',         desc: '代码托管与开源社区',    url: 'https://github.com' },
            { icon: '🤖', name: 'ChatGPT',        desc: 'OpenAI 人工智能助手',  url: 'https://chat.openai.com' },
            { icon: '🎨', name: 'Canva',           desc: '在线设计工具',        url: 'https://www.canva.com' },
            { icon: '📝', name: 'Notion',          desc: '多功能笔记与知识库',   url: 'https://www.notion.so' },
            { icon: '🌤', name: '中国天气网',      desc: '实时天气预报',         url: 'https://www.weather.com.cn' },
        ];
        const study = [
            { icon: '📖', name: 'MDN Web 文档',   desc: '前端开发权威参考手册',  url: 'https://developer.mozilla.org/zh-CN/' },
            { icon: '🐍', name: 'Python 官方教程', desc: 'Python 入门到进阶',    url: 'https://docs.python.org/zh-cn/3/tutorial/' },
            { icon: '🎓', name: '菜鸟教程',        desc: '编程基础教程大全',     url: 'https://www.runoob.com' },
            { icon: '📊', name: 'Kaggle',          desc: '数据科学 & 机器学习',  url: 'https://www.kaggle.com' },
            { icon: '🌐', name: 'W3Schools',       desc: 'Web 开发在线教程',     url: 'https://www.w3schools.com' },
            { icon: '📺', name: 'Bilibili',        desc: '视频学习平台',         url: 'https://www.bilibili.com' },
        ];

        function renderCards(id, data) {
            const g = document.getElementById(id);
            if (!data || !data.length) {
                g.innerHTML = '<div class="empty-state" style="text-align:center;padding:60px 0;color:#6a5a80"><div style="font-size:48px;margin-bottom:12px">🌸</div><p>还没有内容～</p></div>';
                return;
            }
            g.innerHTML = data.map(d =>
                `<div class="card" onclick="window.open('${d.url}','_blank')">
                    <div class="icon">${d.icon}</div>
                    <h3>${d.name}</h3>
                    <p>${d.desc}</p>
                </div>`
            ).join('');
        }
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
            });
        });
        renderCards('tools-grid', tools);
        renderCards('study-grid', study);

        // ================================================================
        //  星空 Canvas — 漫画风格闪光星星 + 双鱼座星座
        // ================================================================
        (function() {
            const canvas = document.getElementById('star-canvas');
            const ctx = canvas.getContext('2d');
            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            // ---- 漫画风格闪光星星绘制函数 ----
            // 4 角星（漫画闪光的经典形状，类似 ✨）
            function drawSparkle(cx, cy, size, color, rotation) {
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(rotation || 0);
                ctx.beginPath();
                // 使用贝塞尔曲线绘制柔和四角星
                const s = size;
                // 上顶点 → 右上凹 → 右顶点 → 右下凹 → 下顶点 → 左下凹 → 左顶点 → 左上凹
                const pts = [
                    { x: 0,    y: -s },   // 上
                    { x: s*0.3, y: -s*0.3 },
                    { x: s,    y: 0 },    // 右
                    { x: s*0.3, y: s*0.3 },
                    { x: 0,    y: s },    // 下
                    { x: -s*0.3, y: s*0.3 },
                    { x: -s,   y: 0 },    // 左
                    { x: -s*0.3, y: -s*0.3 },
                ];
                ctx.moveTo(pts[0].x, pts[0].y);
                for (let i = 1; i < pts.length; i++) {
                    ctx.lineTo(pts[i].x, pts[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();

                // 中心高光小圆
                ctx.beginPath();
                ctx.arc(0, 0, s * 0.12, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.fill();

                ctx.restore();
            }

            // ---- 1. 背景星星 ----
            // 两种类型: 小圆点 + 漫画闪光星
            const STARS = 180;
            const stars = [];
            // 星色彩色板 (在深色背景上发光)
            const colors = [
                { r: 200, g: 170, b: 255 },  // 淡紫
                { r: 255, g: 200, b: 220 },  // 粉红
                { r: 180, g: 210, b: 255 },  // 淡蓝
                { r: 255, g: 220, b: 180 },  // 暖金
                { r: 220, g: 180, b: 255 },  // 紫罗兰
                { r: 255, g: 190, b: 210 },  // 玫瑰粉
            ];

            for (let i = 0; i < STARS; i++) {
                const col = colors[Math.floor(Math.random() * colors.length)];
                const isSparkle = Math.random() < 0.25; // 25% 是闪光星
                stars.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    r: isSparkle ? Math.random() * 5 + 3 : Math.random() * 1.8 + 0.5,
                    type: isSparkle ? 'sparkle' : 'dot',
                    col,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.002,
                    s1: Math.random() * 0.012 + 0.004,
                    s2: Math.random() * 0.022 + 0.010,
                    p1: Math.random() * Math.PI * 2,
                    p2: Math.random() * Math.PI * 2,
                    depth: Math.random() * 0.55 + 0.25,
                    baseA: Math.random() * 0.35 + 0.2,
                });
            }

            // ---- 2. 双鱼座星座 ----
            const pts = [
                { x: 0.16, y: 0.58 }, { x: 0.20, y: 0.50 },
                { x: 0.26, y: 0.44 }, { x: 0.32, y: 0.41 },
                { x: 0.37, y: 0.44 }, { x: 0.35, y: 0.50 },
                { x: 0.40, y: 0.53 },  // 结星
                { x: 0.45, y: 0.56 }, { x: 0.50, y: 0.52 },
                { x: 0.56, y: 0.49 }, { x: 0.62, y: 0.48 },
                { x: 0.68, y: 0.51 }, { x: 0.72, y: 0.56 },
                { x: 0.13, y: 0.64 }, { x: 0.75, y: 0.49 },
            ];

            let cst;
            function updCst() { cst = pts.map(p => ({ x: p.x * W, y: p.y * H })); }
            updCst();
            window.addEventListener('resize', updCst);

            const edges = [
                [0, 1, 0], [1, 2, 0], [2, 3, 0], [3, 4, 0], [4, 5, 0],
                [5, 6, 2], [6, 7, 1],
                [7, 8, 1], [8, 9, 1], [9, 10, 1], [10, 11, 1],
                [5, 13, 0], [11, 14, 1],
            ];
            const grpPh = [0, 2.5, 4.2];

            const cstParams = pts.map(() => ({
                speed: 0.008 + Math.random() * 0.012,
                phase: Math.random() * Math.PI * 2,
                depth: 0.3 + Math.random() * 0.4,
            }));

            // ---- 3. 渲染循环 ----
            let frame = 0;

            function draw() {
                ctx.clearRect(0, 0, W, H);
                frame++;

                // --- 背景星星 ---
                for (const s of stars) {
                    const w1 = Math.sin(frame * s.s1 + s.p1);
                    const w2 = Math.sin(frame * s.s2 + s.p2) * 0.35;
                    const tw = (w1 + w2) * s.depth * 0.45 + (1 - s.depth * 0.45);
                    const a = s.baseA * Math.max(0.05, tw);
                    const { r, g, b } = s.col;

                    if (s.type === 'dot') {
                        // 圆点星: 光晕 + 核心
                        const gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 4);
                        gr.addColorStop(0, `rgba(${r},${g},${b},${a * 0.15})`);
                        gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        ctx.fillStyle = gr;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * 4, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * Math.max(0.3, tw), 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(${r},${g},${b},${a * 0.85})`;
                        ctx.fill();

                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * 0.3, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255,255,255,${a * 0.5})`;
                        ctx.fill();
                    } else {
                        // 漫画闪光星
                        const bright = Math.max(0.3, tw);
                        s.rot += s.rotSpeed;
                        const color = `rgba(${r},${g},${b},${a * 0.85})`;
                        drawSparkle(s.x, s.y, s.r * bright, color, s.rot);

                        // 外加一层光晕
                        const gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3);
                        gr.addColorStop(0, `rgba(${r},${g},${b},${a * 0.08})`);
                        gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
                        ctx.fillStyle = gr;
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // --- 星座连线 ---
                for (const [i, j, g] of edges) {
                    const p1 = cst[i], p2 = cst[j];
                    const breath = Math.sin(frame * 0.005 + grpPh[g] + i * 0.25) * 0.5 + 0.5;
                    const la = 0.06 + breath * 0.20;
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = `rgba(170, 130, 210, ${la})`;
                    ctx.lineWidth = 0.8 + breath * 0.6;
                    ctx.stroke();
                }

                // --- 星座星星 (全部用漫画闪光星风格) ---
                for (let i = 0; i < cst.length; i++) {
                    const p = cst[i];
                    const cp = cstParams[i];
                    const isKnot = i === 6;
                    const isExtra = i >= 13;

                    const tw = Math.sin(frame * cp.speed + cp.phase) * cp.depth * 0.4 + (1 - cp.depth * 0.4);
                    const a = Math.max(0.25, tw);

                    const baseSize = isKnot ? 10 : isExtra ? 4 : 7;
                    const glowR = isKnot ? 40 : isExtra ? 12 : 25;

                    // 光晕 (用玫瑰粉紫)
                    const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowR);
                    const ga = isKnot ? 0.18 : 0.10;
                    grd.addColorStop(0, `rgba(200, 130, 180, ${ga * a})`);
                    grd.addColorStop(1, `rgba(200, 130, 180, 0)`);
                    ctx.fillStyle = grd;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
                    ctx.fill();

                    // 用闪光星绘制星座星
                    const starColor = isKnot
                        ? `rgba(244, 140, 170, ${0.9 * a})`
                        : `rgba(200, 160, 230, ${0.8 * a})`;
                    const rot = frame * 0.005 + i * 1.2;
                    drawSparkle(p.x, p.y, baseSize * a, starColor, rot);

                    // 结星加玫瑰金高光环
                    if (isKnot) {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 220, 230, ${0.7 * a})`;
                        ctx.fill();
                    }
                }

                // --- 标注 ---
                const lb = cst[11];
                const blink = Math.sin(frame * 0.006) * 0.5 + 0.5;
                ctx.font = '12px "Segoe UI", sans-serif';
                ctx.fillStyle = `rgba(150, 130, 180, ${0.15 + blink * 0.25})`;
                ctx.textAlign = 'left';
                ctx.fillText('♓ Pisces', lb.x + 14, lb.y + 6);

                requestAnimationFrame(draw);
            }

            draw();

            window.addEventListener('resize', () => {
                for (const s of stars) {
                    s.x = Math.random() * W;
                    s.y = Math.random() * H;
                }
            });
        })();
    </script>
</body>
</html>
