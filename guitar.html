<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吉他谱 - 双鱼小栈</title>
<link rel="stylesheet" href="common.css">
<style>
.srch{max-width:900px;margin:0 auto;padding:0 20px 10px;position:relative}
.srch input{
  width:100%;padding:10px 16px;border:1px solid rgba(255,255,255,0.08);border-radius:10px;
  background:rgba(255,255,255,0.06);color:#e0d0e8;font-size:14px;outline:none;
  backdrop-filter:blur(10px);transition:border-color .3s
}
.srch input::placeholder{color:#5a4a70}
.srch input:focus{border-color:rgba(244,143,177,0.3)}
.srch .clr{position:absolute;right:28px;top:50%;transform:translateY(-50%);border:none;background:none;color:#6a5a80;font-size:16px;cursor:pointer;display:none;padding:4px}
.srch .clr.on{display:block}
.srch .clr:hover{color:#f48fb1}

.star{
  display:inline-block;cursor:pointer;user-select:none;font-size:17px;
  margin-left:5px;vertical-align:middle;line-height:1;transition:all .3s
}
.star:hover{transform:scale(1.4)}
.star.on{color:#f48fb1;font-size:20px;text-shadow:0 0 14px rgba(244,143,177,0.6)}
.star.pop{animation:starPop .4s ease}
@keyframes starPop{
  0%{transform:scale(1)}
  40%{transform:scale(1.6);color:#ffe0ec}
  100%{transform:scale(1)}
}
.card.fav{
  border-color:rgba(244,143,177,0.25);
  background:rgba(244,143,177,0.06);
  box-shadow:0 0 20px rgba(244,143,177,0.06)
}
.card.fav:hover{
  border-color:rgba(244,143,177,0.35);
  background:rgba(244,143,177,0.09);
  box-shadow:0 8px 30px rgba(244,143,177,0.1)
}

.capo-badge{
  font-size:11px;color:#a8d8ea;background:rgba(168,216,234,0.12);
  padding:2px 10px;border-radius:20px;white-space:nowrap;margin-left:auto;flex-shrink:0;
  cursor:pointer;transition:all .3s;min-width:46px;text-align:center;line-height:1.7
}
.capo-badge:hover{background:rgba(168,216,234,0.2)}
.capo-badge.none{color:#5a4a70;background:transparent}
.capo-badge.none:hover{background:rgba(255,255,255,0.06)}
.card .n{flex:1;min-width:0}
.card .n h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.metro{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.metro-btn{
  width:32px;height:32px;border:none;border-radius:50%;font-size:14px;cursor:pointer;
  background:#444;color:#fff;display:flex;align-items:center;justify-content:center;
  transition:all .2s;flex-shrink:0
}
.metro-btn:hover{background:#666}
.metro-btn.on{background:#a8d8ea;color:#1a1d4e}
.metro-btn.on:hover{background:#81d4fa}
.metro-sel{
  padding:2px 4px;border:1px solid #555;border-radius:5px;
  background:#111;color:#eee;font-size:12px;outline:none;cursor:pointer;font-family:inherit
}
.metro-sel:focus{border-color:#a8d8ea}
.bdots{display:inline-flex;gap:3px;align-items:center}
.bdot{
  width:7px;height:7px;border-radius:50%;background:#555;
  transition:background .06s,transform .06s;flex-shrink:0
}
.bdot.on{background:#a8d8ea;transform:scale(1.4)}
.bdot.acc{width:9px;height:9px}
.bdot.acc.on{background:#f48fb1;box-shadow:0 0 6px rgba(244,143,177,0.6)}

.list{max-width:900px;margin:12px auto;padding:0 20px;display:grid;gap:14px}
.card{
  background:rgba(255,255,255,0.05);backdrop-filter:blur(16px);border-radius:16px;
  padding:20px 24px;border:1px solid rgba(255,255,255,0.06);
  cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:16px
}
.card:hover{
  transform:translateY(-2px);border-color:rgba(244,143,177,0.2);
  background:rgba(255,255,255,0.08);box-shadow:0 8px 30px rgba(100,60,160,0.15)
}
.card .ico{width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.06);border-radius:12px;font-size:28px}
.card .n h3{font-size:18px;font-weight:600;color:#e0d0e8}
.card .n p{font-size:13px;color:#8a7aaa;margin-top:2px;letter-spacing:1px}
/* ===== VIEWER ===== */
.vwr{display:none;position:fixed;inset:0;z-index:1000;background:#000;flex-direction:column}
.vwr.on{display:flex}
.vwr .top{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:rgba(0,0,0,0.8);flex-shrink:0}
.vwr .top .t{font-size:15px;font-weight:600;color:#e0d0e8;letter-spacing:1px}
.vwr .top button{width:34px;height:34px;border:none;background:rgba(255,255,255,0.12);border-radius:50%;color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vwr .top button:hover{background:rgba(255,255,255,0.25)}
.vwr .body{
  flex:1;overflow:auto;-webkit-overflow-scrolling:touch;
  display:flex;flex-direction:column;align-items:center
}
.vwr .body::-webkit-scrollbar{width:5px}
.vwr .body::-webkit-scrollbar-track{background:transparent}
.vwr .body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:3px}
.vwr .body img{display:block;height:auto;flex-shrink:0}
.vwr .body .ld{color:#8a7aaa;font-size:14px;letter-spacing:2px;margin-top:50px}

/* bottom bar */
.vwr .bot{
  flex-shrink:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(10px);
  padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center
}
/* auto-scroll button */
.btr{
  padding:7px 16px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
  background:#2ecc71;color:#fff;white-space:nowrap
}
.btr:hover{background:#27ae60}
.btr.on{background:#e74c3c}
.btr.on:hover{background:#c0392b}

/* === control group (reused for both speed and zoom) === */
.cgrp{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cgrp .lb{font-size:13px;color:#ccc;white-space:nowrap}
.cgrp .vl{color:#a8d8ea;font-weight:600;font-size:13px;min-width:20px;text-align:center}
.cgrp input[type=range]{
  width:90px;height:4px;-webkit-appearance:none;appearance:none;background:#444;border-radius:2px;outline:none
}
.cgrp input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;background:#a8d8ea;border-radius:50%;cursor:pointer;border:none
}
.cgrp input[type=range]::-moz-range-thumb{
  width:15px;height:15px;background:#a8d8ea;border-radius:50%;cursor:pointer;border:none
}
.cgrp .ni{
  width:40px;padding:3px 3px;border:1px solid #555;border-radius:5px;
  background:#111;color:#eee;font-size:12px;font-family:'Courier New',monospace;text-align:center;outline:none
}
.cgrp .ni:focus{border-color:#a8d8ea}
.cgrp .ni.er{border-color:#e74c3c}

/* square icon button for zoom */
.zbtn{
  width:28px;height:28px;border:none;border-radius:6px;cursor:pointer;
  font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;
  background:#444;color:#fff;user-select:none
}
.zbtn:hover{background:#666}
.zbtn:active{background:#777}

.agrp{display:inline-flex;flex-direction:column;gap:1px;vertical-align:middle}
.agrp button{
  width:20px;height:13px;border:none;cursor:pointer;font-size:6px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  border-radius:2px;background:#444;color:#a8d8ea;padding:0;user-select:none
}
.agrp button:hover{background:#666}
.agrp button:active{background:#777}
.sep{width:1px;height:24px;background:rgba(255,255,255,0.12)}

.fav-fil{display:flex;gap:8px;max-width:900px;margin:0 auto;padding:0 20px 12px}
.fav-fil button{
  padding:5px 16px;border:1px solid rgba(255,255,255,0.08);border-radius:20px;
  background:rgba(255,255,255,0.04);color:#8a7aaa;font-size:13px;cursor:pointer;
  transition:all .3s;letter-spacing:1px;font-family:inherit
}
.fav-fil button:hover{border-color:rgba(244,143,177,0.2);color:#b8a0cc}
.fav-fil button.on{background:rgba(244,143,177,0.12);border-color:rgba(244,143,177,0.25);color:#f48fb1}
.fav-fil .cnt{font-size:11px;margin-left:3px;opacity:0.6}

@media(max-width:640px){
  .hdr h1{font-size:26px;letter-spacing:3px}
  .card{padding:14px 16px}
  .card .ico{width:42px;height:42px;font-size:22px}
  .cgrp input[type=range]{width:70px}
  .vwr .bot{gap:8px;padding:8px 10px}
}

/* ===== Transcription UI ===== */
.tsc-entry{max-width:900px;margin:16px auto;padding:0 20px}
.tsc-card{
  background:linear-gradient(135deg,rgba(168,216,234,0.08),rgba(244,143,177,0.06));
  backdrop-filter:blur(16px);border-radius:16px;
  padding:20px 24px;border:1px solid rgba(168,216,234,0.12);
  cursor:pointer;transition:all .3s;display:flex;align-items:center;gap:16px
}
.tsc-card:hover{
  transform:translateY(-2px);border-color:rgba(168,216,234,0.3);
  box-shadow:0 8px 30px rgba(100,180,220,0.12)
}
.tsc-card .ico{width:52px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(168,216,234,0.1);border-radius:12px;font-size:28px}
.tsc-card .n h3{font-size:18px;font-weight:600;color:#a8d8ea;letter-spacing:1px}
.tsc-card .n p{font-size:13px;color:#8a7aaa;margin-top:2px;letter-spacing:1px}
.tsc-card .arr{color:#8a7aaa;font-size:20px;margin-left:auto;flex-shrink:0}

.tsc-ovl{display:none;position:fixed;inset:0;z-index:1100;background:rgba(10,8,20,0.95);flex-direction:column}
.tsc-ovl.on{display:flex}
.tsc-ovl .top{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.05);flex-shrink:0}
.tsc-ovl .top .t{font-size:16px;font-weight:600;color:#a8d8ea;letter-spacing:2px}
.tsc-close-btn{
  height:34px;border-radius:8px;padding:0 16px;font-size:14px;font-weight:600;
  background:rgba(231,76,60,0.15);color:#e74c3c;
  border:1px solid rgba(231,76,60,0.25);letter-spacing:1px;
  cursor:pointer;transition:all .3s;font-family:inherit
}
.tsc-close-btn:hover{background:rgba(231,76,60,0.3);border-color:rgba(231,76,60,0.5)}

.tsc-body{flex:1;overflow:auto;padding:30px 20px;display:flex;flex-direction:column;align-items:center;min-height:0}
.tsc-body::-webkit-scrollbar{width:5px}
.tsc-body::-webkit-scrollbar-track{background:transparent}
.tsc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px}

.tsc-upload{
  width:100%;max-width:500px;text-align:center;margin:10px 0
}
.tsc-upload .drop-zone{
  border:2px dashed rgba(168,216,234,0.2);
  border-radius:20px;padding:50px 30px;transition:all .3s;
  background:radial-gradient(ellipse at center,rgba(168,216,234,0.03) 0%,transparent 70%);
  margin-bottom:16px
}
.tsc-upload .drop-zone:hover,.tsc-upload .drop-zone.drag{
  border-color:rgba(168,216,234,0.5);background:radial-gradient(ellipse at center,rgba(168,216,234,0.07) 0%,transparent 70%)
}
.tsc-upload .drop-zone .big{font-size:56px;display:block;margin-bottom:8px}
.tsc-upload .drop-zone .hint{color:#8a7aaa;font-size:14px;letter-spacing:1px;margin:4px 0}
.tsc-upload .drop-zone .hint span{color:#a8d8ea;cursor:pointer;border-bottom:1px dashed rgba(168,216,234,0.3)}
.tsc-upload .drop-zone .hint span:hover{border-color:#a8d8ea}
.tsc-upload .drop-zone .sub{font-size:12px;color:#5a4a70;margin-top:2px}
.tsc-upload input[type=file]{display:none}

.tsc-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:4px}
.tsc-btn{
  padding:10px 24px;border:1px solid rgba(168,216,234,0.2);border-radius:10px;
  background:rgba(168,216,234,0.08);color:#a8d8ea;font-size:14px;cursor:pointer;
  font-family:inherit;letter-spacing:1px;transition:all .3s
}
.tsc-btn:hover{background:rgba(168,216,234,0.16);border-color:rgba(168,216,234,0.4)}
.tsc-btn.rec{background:rgba(231,76,60,0.12);border-color:rgba(231,76,60,0.2);color:#e74c3c}
.tsc-btn.rec:hover{background:rgba(231,76,60,0.22)}
.tsc-btn.rec.on{animation:pulse-rec 1.2s infinite}
@keyframes pulse-rec{0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,0.3)}50%{box-shadow:0 0 0 10px rgba(231,76,60,0)}}
.tsc-btn.sec{background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.1);color:#8a7aaa}
.tsc-btn.sec:hover{background:rgba(255,255,255,0.08);color:#a8d8ea}

.tsc-progress{display:none;width:100%;max-width:460px;margin:40px 0;text-align:center}
.tsc-progress.on{display:block}
.tsc-progress .pct{font-size:40px;font-weight:700;color:#a8d8ea;letter-spacing:2px;margin-bottom:6px}
.tsc-progress .txt{color:#8a7aaa;font-size:14px;letter-spacing:1px;margin-bottom:16px}
.tsc-progress .bar-wrap{
  width:100%;height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;margin:0 0 20px
}
.tsc-progress .bar-fill{
  height:100%;background:linear-gradient(90deg,#81d4fa,#f48fb1);border-radius:3px;
  transition:width .4s ease;width:0%
}

.tsc-result{display:none;width:100%;max-width:900px;flex-direction:column;align-items:center;flex:1}
.tsc-result.on{display:flex}
.tsc-result .r-header{width:100%;text-align:center;padding:8px 0 14px;flex-shrink:0}
.tsc-result .r-header .r-title{font-size:18px;font-weight:600;color:#a8d8ea;letter-spacing:1px}
.tsc-result .r-header .r-meta{font-size:12px;color:#6a5a80;margin-top:4px;letter-spacing:1px}
.tsc-result .info{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:14px;flex-shrink:0}
.tsc-result .info .itm{
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);
  border-radius:10px;padding:10px 18px;min-width:80px;text-align:center
}
.tsc-result .info .itm .v{font-size:20px;font-weight:600;color:#a8d8ea}
.tsc-result .info .itm .l{font-size:11px;color:#6a5a80;letter-spacing:1px;margin-top:1px}
.tsc-result .capo-wrap{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-shrink:0;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.05);
  border-radius:10px;padding:6px 16px
}
.tsc-result .capo-wrap .lb{font-size:12px;color:#6a5a80;letter-spacing:1px}
.tsc-result .capo-wrap .cb{
  width:32px;height:32px;border:none;border-radius:6px;background:rgba(168,216,234,0.1);
  color:#a8d8ea;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s
}
.tsc-result .capo-wrap .cb:hover{background:rgba(168,216,234,0.2)}
.tsc-result .capo-wrap .cv{font-size:16px;font-weight:600;color:#f48fb1;min-width:20px;text-align:center}
.tsc-result .at-wrap{width:100%;background:rgba(255,255,255,0.02);border-radius:12px;overflow:auto;padding:12px;flex:1;min-height:0;border:1px solid rgba(255,255,255,0.04)}
.tsc-result .at-wrap::-webkit-scrollbar{width:6px;height:6px}
.tsc-result .at-wrap::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}
.tsc-result .at-wrap::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}
.tsc-result .note{color:#5a4a70;font-size:11px;margin-top:10px;text-align:center;letter-spacing:1px;flex-shrink:0}
.tsc-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:14px 0 6px;
  position:sticky;bottom:0;z-index:5;
  background:rgba(10,8,20,0.95);backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,255,255,0.04);
  margin-top:auto;width:100%}
.tsc-bar-playing{border-color:rgba(168,216,234,0.7)!important;box-shadow:0 0 12px rgba(168,216,234,0.35);background:rgba(168,216,234,0.08)!important}

.tsc-history{width:100%;max-width:500px;margin:4px 0 0;text-align:left}
.tsc-hist-title{font-size:13px;font-weight:600;color:#6a5a80;padding:10px 0 8px;letter-spacing:1px;text-align:center;border-top:1px solid rgba(255,255,255,0.05)}
.tsc-hist-item{display:flex;align-items:center;padding:10px 14px;margin:3px 0;background:rgba(255,255,255,0.02);border-radius:8px;cursor:pointer;transition:all .2s}
.tsc-hist-item:hover{background:rgba(168,216,234,0.06)}
.hi2-title{display:flex;align-items:center;gap:6px}
.hi2-txt{font-size:14px;color:#c8d8e8;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.hi2-sub{font-size:11px;color:#5a4a70;margin-top:2px}
.rn-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:0 2px;opacity:0.3;transition:opacity .15s;flex-shrink:0;line-height:1}
.rn-btn:hover{opacity:1}


</style>
</head>
<body>

<a href="#main-content" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;z-index:999"
   onfocus="this.style.left='16px';this.style.top='16px';this.style.width='auto';this.style.height='auto';this.style.background='#1a1d4e';this.style.color='#f48fb1';this.style.padding='12px 24px';this.style.borderRadius='8px';this.style.fontSize='16px';this.style.fontWeight='600';this.style.textDecoration='none'"
   onblur="this.style.left='-9999px';this.style.width='1px';this.style.height='1px'">跳到主内容</a>

<div class="hdr">
  <a href="index.html">← 返回首页</a>
  <h1>吉他谱</h1>
  <p>收藏喜欢的吉他谱，随时弹唱</p>
  <div class="div"></div>
</div>

<div class="tsc-entry" id="main-content">
  <div class="tsc-card" id="tscCard">
    <div class="ico">🎸</div>
    <div class="n"><h3>智能扒谱</h3><p>上传音频 / 录音 → AI 自动生成吉他谱</p></div>
    <span class="arr">→</span>
  </div>
</div>

<div class="srch"><input type="text" id="sInp" placeholder="搜索歌曲或艺人..." autocomplete="off" aria-label="搜索吉他谱"><button class="clr" id="sClr" aria-label="清除搜索">✕</button></div>

<div class="fav-fil" id="favFil">
  <button class="on" data-fav="all">全部</button>
  <button data-fav="fav">⭐ 收藏 <span class="cnt" id="favCnt">0</span></button>
</div>

<div class="list" id="list"></div>
<div class="footer">双鱼小栈 · 吉他谱</div>

<!-- Viewer -->
<div class="vwr" id="vwr">
  <div class="top">
    <span class="t" id="vTitle">—</span>
    <button id="vClose">✕</button>
  </div>
  <div class="body" id="vBody">
    <div class="ld" id="vLd">加载中...</div>
    <img id="vImg" alt="吉他谱">
  </div>
  <div class="bot">
    <button class="btr" id="vRoll">▶ 自动滚动</button>

    <div class="sep"></div>

    <div class="cgrp">
      <span class="lb">速度</span>
      <span class="vl" id="spdVal">4.0</span>
      <input type="range" id="spdRng" min="1" max="10" step="0.1" value="4">
      <input type="text" class="ni" id="spdInp" value="4.0" maxlength="4" inputmode="decimal">
      <div class="agrp">
        <button data-d="1">▲</button>
        <button data-d="-1">▼</button>
      </div>
    </div>

    <div class="sep"></div>

    <div class="cgrp">
      <span class="lb">缩放</span>
      <button class="zbtn" id="zmOut">−</button>
      <span class="vl" id="zmVal" style="min-width:36px">25%</span>
      <button class="zbtn" id="zmIn">+</button>
    </div>

    <div class="sep"></div>

    <div class="cgrp metro">
      <button class="metro-btn" id="mBtn" title="快捷键 M">▶</button>
      <span class="lb">BPM</span>
      <input type="range" id="mBpm" min="40" max="240" value="120" step="1" style="width:70px">
      <span class="vl" id="mBpmV" style="min-width:28px">120</span>

<script>
(function(){
'use strict';

var SONGS = [
  {id:'hourai',  title:'后来',             artist:'刘若英', file:'hourai.jpg',  size:'1.3 MB'},
  {id:'amani',   title:'Amani',            artist:'BEYOND',  file:'amani.jpg',   size:'200 KB'},
  {id:'tianshi', title:'跌落凡间的天使',  artist:'王祖蓝',  file:'tianshi.jpg', size:'339 KB'},
  {id:'star',    title:'夜空中最亮的星',  artist:'逃跑计划', file:'star.jpg',    size:'956 KB'},
  {id:'coldday', title:'最冷一天',          artist:'张国荣', file:'coldday.jpg', size:'143 KB'},
];

// ===== localStorage meta (favorites + capo) =====
var STORE = 'guitar-meta';
function loadMeta(){
  try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; }
}
function saveMeta(m){
  try{ localStorage.setItem(STORE, JSON.stringify(m)); }catch(e){}
}
function getMeta(id){
  var m = loadMeta();
  return m[id] || {fav:false, capo:0};
}
function setMeta(id, u){
  var m = loadMeta();
  m[id] = m[id] || {fav:false, capo:0};
  for(var k in u) m[id][k] = u[k];
  saveMeta(m);
}

// ===== DOM refs =====
var listEl = document.getElementById('list');
var sInp = document.getElementById('sInp');
var sClr = document.getElementById('sClr');

var vwr=document.getElementById('vwr'), vBody=document.getElementById('vBody'),
    vImg=document.getElementById('vImg'), vLd=document.getElementById('vLd'),
    vTitle=document.getElementById('vTitle'), vClose=document.getElementById('vClose'),
    vRoll=document.getElementById('vRoll'),
    spdRng=document.getElementById('spdRng'), spdInp=document.getElementById('spdInp'),
    spdVal=document.getElementById('spdVal'),
    zmIn=document.getElementById('zmIn'), zmOut=document.getElementById('zmOut'),
    zmVal=document.getElementById('zmVal'),
    cVal=document.getElementById('cVal'), cUp=document.getElementById('cUp'), cDown=document.getElementById('cDown'),
    mBtn=document.getElementById('mBtn'), mBpm=document.getElementById('mBpm'),
    mBpmV=document.getElementById('mBpmV'), mDots=document.getElementById('mDots'),
    mTime=document.getElementById('mTime');

var rolling=false, speed=4, zoom=25, arrowTimers={}, rollTimer=null, rollAcc=0;
var currentSongId = null;
var filterText = '';
var showFavOnly = false;

// ===== Render list =====
function renderList(filter){
  var data = SONGS;
  if(filter){
    var lf = filter.toLowerCase();
    data = data.filter(function(s){
      return s.title.toLowerCase().indexOf(lf) !== -1 ||
             (s.artist && s.artist.toLowerCase().indexOf(lf) !== -1);
    });
  }
  var meta = loadMeta();

  // showFavOnly — only favorited
  if(showFavOnly){
    data = data.filter(function(s){ return meta[s.id] && meta[s.id].fav; });
  }

  var sorted = data.slice().sort(function(a,b){
    var fa = meta[a.id] && meta[a.id].fav ? 1 : 0;
    var fb = meta[b.id] && meta[b.id].fav ? 1 : 0;
    return fb - fa;
  });

  // update fav count
  var favCount = 0;
  for(var k in meta){ if(meta[k].fav) favCount++; }
  document.getElementById('favCnt').textContent = favCount;

  if(!sorted.length){
    listEl.innerHTML = '<div style="text-align:center;padding:60px 20px;color:#6a5a80;font-size:14px;letter-spacing:2px">'+(showFavOnly?'还没有收藏的歌曲，点击 ☆ 收藏':'没有找到匹配的歌曲')+'</div>';
    return;
  }

  listEl.innerHTML = sorted.map(function(s){
    var sm = meta[s.id] || {fav:false, capo:0};
    var info = s.size;
    if(s.artist) info = s.artist + ' · ' + info;
    var starCls = sm.fav ? 'star on' : 'star';
    var starCh = sm.fav ? '★' : '☆';
    var capoText = sm.capo > 0 ? 'Capo '+sm.capo : '无';
    var capoCls = sm.capo > 0 ? 'capo-badge' : 'capo-badge none';
    var cardFav = sm.fav ? ' fav' : '';
    return '<div class="card'+cardFav+'" data-id="'+s.id+'">'+
      '<div class="ico">🎸</div>'+
      '<div class="n"><h3>'+s.title+' <span class="'+starCls+'" data-id="'+s.id+'">'+starCh+'</span></h3><p>'+info+'</p></div>'+
      '<span class="'+capoCls+'" data-id="'+s.id+'">'+capoText+'</span></div>';
  }).join('');
}

renderList('');

// ===== Search =====
sInp.addEventListener('input', function(){
  filterText = this.value;
  sClr.classList.toggle('on', filterText.length > 0);
  renderList(filterText);
});
sClr.addEventListener('click', function(){
  sInp.value = '';
  filterText = '';
  sClr.classList.remove('on');
  renderList('');
  sInp.focus();
});

// ===== Favorite filter =====
var favFil = document.getElementById('favFil');
favFil.addEventListener('click', function(e){
  var btn = e.target.closest('button');
  if(!btn) return;
  showFavOnly = btn.dataset.fav === 'fav';
  favFil.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b === btn); });
  renderList(filterText);
});

// ===== Click delegation =====
listEl.addEventListener('click', function(e){
  // star toggle
  if(e.target.classList.contains('star')){
    e.stopPropagation();
    var id = e.target.dataset.id;
    var sm = getMeta(id);
    var newFav = !sm.fav;
    setMeta(id, {fav: newFav});
    // pop animation
    e.target.classList.add('pop');
    setTimeout(function(){ e.target.classList.remove('pop'); }, 400);
    renderList(filterText);
    return;
  }
  // capo cycle on card
  if(e.target.classList.contains('capo-badge')){
    e.stopPropagation();
    var id = e.target.dataset.id;
    var sm = getMeta(id);
    setMeta(id, {capo: sm.capo >= 7 ? 0 : sm.capo + 1});
    renderList(filterText);
    return;
  }
  // open song
  var card = e.target.closest('.card');
  if(!card) return;
  var song = SONGS.find(function(s){ return s.id === card.dataset.id; });
  if(song) openViewer(song);
});

// ===== Viewer =====
function openViewer(song){
  stopRoll();
  stopMetro();
  zoom=25;
  applyZoom();
  vLd.style.display='block'; vLd.textContent='加载中...';
  vTitle.textContent=song.title+' — '+(song.artist||'');
  vBody.scrollTop=0;
  vwr.classList.add('on');
  currentSongId = song.id;

  var sm = getMeta(song.id);
  cVal.textContent = sm.capo;

  var ldTimer = setTimeout(function(){ vLd.style.display='none'; }, 1000);
  vImg.onload=function(){ clearTimeout(ldTimer); vLd.style.display='none'; };
  vImg.onerror=function(){ clearTimeout(ldTimer); vLd.textContent='加载失败，点击图片重试'; };
  vImg.src = song.file;
}
function closeViewer(){
  vwr.classList.remove('on');
  stopRoll();
  stopMetro();
  currentSongId = null;
}
vClose.addEventListener('click', closeViewer);

// keyboard
document.addEventListener('keydown', function(e){
  if(!vwr.classList.contains('on')) return;
  if(e.key === 'Escape') closeViewer();
  if(e.key === ' ') { e.preventDefault(); vRoll.click(); }
  if(e.key === 'm' || e.key === 'M') { e.preventDefault(); mBtn.click(); }
});

// ===== auto scroll =====
vRoll.addEventListener('click', function(){ rolling ? stopRoll() : startRoll(); });
function startRoll(){
  if(rolling) return;
  rolling=true; rollAcc=0;
  vRoll.textContent='⏸ 暂停';
  vRoll.classList.add('on');
  rollTimer=setInterval(function(){
    rollAcc+=speed*speed*0.03 + speed*0.1;
    if(rollAcc>=1){vBody.scrollTop+=Math.floor(rollAcc); rollAcc%=1;}
    if(vBody.scrollTop+vBody.clientHeight >= vBody.scrollHeight-3) stopRoll();
  },50);
}
function stopRoll(){
  rolling=false;
  vRoll.textContent='▶ 自动滚动';
  vRoll.classList.remove('on');
  if(rollTimer){clearInterval(rollTimer);rollTimer=null;}
}

// ===== speed =====
function setSpeed(v){
  v=Math.round(v*10)/10;
  if(v<1)v=1; if(v>10)v=10;
  speed=v;
  spdRng.value=v;
  spdInp.value=v.toFixed(1);
  spdVal.textContent=v.toFixed(1);
}
spdRng.addEventListener('input',function(){setSpeed(parseFloat(spdRng.value));});
spdInp.addEventListener('focus',function(){this.select();});
spdInp.addEventListener('blur',function(){
  var v=parseFloat(this.value);
  if(isNaN(v))v=speed;
  setSpeed(v);
  this.classList.remove('er');
});
spdInp.addEventListener('keydown',function(e){if(e.key==='Enter')this.blur();});

var arrows=document.querySelectorAll('.agrp button');
for(var i=0;i<arrows.length;i++){(function(btn){
  var d=parseInt(btn.dataset.d);
  function step(){setSpeed(speed+d);}
  btn.addEventListener('mousedown',function(e){
    e.preventDefault();step();
    var id=setInterval(step,120); arrowTimers['a'+d]=id;
  });
  btn.addEventListener('mouseup',function(){clearInterval(arrowTimers['a'+d]);delete arrowTimers['a'+d];});
  btn.addEventListener('mouseleave',function(){clearInterval(arrowTimers['a'+d]);delete arrowTimers['a'+d];});
  btn.addEventListener('touchstart',function(e){e.preventDefault();step();
    var id=setInterval(step,120); arrowTimers['a'+d+'t']=id;});
  btn.addEventListener('touchend',function(){clearInterval(arrowTimers['a'+d+'t']);delete arrowTimers['a'+d+'t'];});
})(arrows[i]);}

// ===== zoom =====
function applyZoom(){
  vImg.style.width=zoom+'%';
  vImg.style.maxWidth='none';
  zmVal.textContent=zoom+'%';
}
zmIn.addEventListener('click',function(){
  if(zoom<300){zoom=Math.min(300,zoom+25); applyZoom();}
});
zmOut.addEventListener('click',function(){
  if(zoom>25){zoom=Math.max(25,zoom-25); applyZoom();}
});

// ===== Capo (viewer) =====
function updateCapo(delta){
  if(!currentSongId) return;
  var sm = getMeta(currentSongId);
  var n = Math.max(0, Math.min(7, sm.capo + delta));
  setMeta(currentSongId, {capo: n});
  cVal.textContent = n;
  renderList(filterText);
}
cUp.addEventListener('click', function(){ updateCapo(1); });
cDown.addEventListener('click', function(){ updateCapo(-1); });

// ===== Metronome (Web Audio API lookahead scheduler) =====
var mCtx = null, mPlay = false, mBeat = 0, mNext = 0, mTimer = null;
var mBpmV_ = 120, mBeats = 4;

function initMCtx(){
  if(!mCtx) mCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(mCtx.state === 'suspended') mCtx.resume();
}
function mClick(t, acc){
  var o = mCtx.createOscillator(), g = mCtx.createGain();
  o.connect(g); g.connect(mCtx.destination);
  o.frequency.value = acc ? 1200 : 800;
  o.type = 'sine';
  g.gain.setValueAtTime(acc ? 0.45 : 0.22, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  o.start(t); o.stop(t + 0.05);
}
function mUpdDots(i){
  var ds = mDots.querySelectorAll('.bdot');
  for(var j=0;j<ds.length;j++) ds[j].classList.toggle('on', j===i);
}
function mSched(){
  if(!mPlay) return;
  var inv = 60 / mBpmV_;
  while(mNext < mCtx.currentTime + 0.1){
    mClick(mNext, mBeat === 0);
    mUpdDots(mBeat);
    mNext += inv;
    mBeat = (mBeat + 1) % mBeats;
  }
  mTimer = setTimeout(mSched, 25);
}
function startMetro(){
  initMCtx();
  mPlay = true;
  mBeats = parseInt(mTime.value);
  mBeat = 0;
  mNext = mCtx.currentTime + 0.05;
  mBtn.textContent = '⏸';
  mBtn.classList.add('on');
  mSched();
}
function stopMetro(){
  mPlay = false;
  if(mTimer){ clearTimeout(mTimer); mTimer = null; }
  mBtn.textContent = '▶';
  mBtn.classList.remove('on');
  var ds = mDots.querySelectorAll('.bdot');
  for(var j=0;j<ds.length;j++) ds[j].classList.remove('on');
}
mBtn.addEventListener('click', function(){ mPlay ? stopMetro() : startMetro(); });
mBpm.addEventListener('input', function(){
  mBpmV_ = parseInt(mBpm.value);
  mBpmV.textContent = mBpmV_;
});
mTime.addEventListener('change', function(){
  mBeats = parseInt(mTime.value);
  mDots.innerHTML = '';
  for(var i=0;i<mBeats;i++){
    var d = document.createElement('span');
    d.className = 'bdot' + (i===0 ? ' acc' : '');
    mDots.appendChild(d);
  }
});
(function initBeatDots(){
  for(var i=0;i<4;i++){
    var d = document.createElement('span');
    d.className = 'bdot' + (i===0 ? ' acc' : '');
    mDots.appendChild(d);
  }
})();

// ===== img retry on click =====
vImg.addEventListener('click', function(){
  if(vLd.textContent.indexOf('重试') !== -1 && currentSongId){
    var s = SONGS.find(function(x){ return x.id === currentSongId; });
    if(s){
      vLd.style.display = 'block'; vLd.textContent = '加载中...';
      vImg.src = s.file;
      setTimeout(function(){ vLd.style.display = 'none'; }, 1000);
    }
  }
});


// ===== Transcription =====
var tscOvl = document.getElementById('tscOvl');
var tscCard = document.getElementById('tscCard');
var tscClose = document.getElementById('tscClose');
var tscUpload = document.getElementById('tscUpload');
var tscFile = document.getElementById('tscFile');
var tscPick = document.getElementById('tscPick');
var tscRec = document.getElementById('tscRec');
var tscProg = document.getElementById('tscProg');
var tscProgTxt = document.getElementById('tscProgTxt');
var tscProgBar = document.getElementById('tscProgBar');
var tscCancel = document.getElementById('tscCancel');
var tscResult = document.getElementById('tscResult');
var tscAtRender = document.getElementById('tscAtRender');
var tscError = document.getElementById('tscError');
var tscErrorTxt = document.getElementById('tscErrorTxt');
var API = 'http://localhost:8765';

var recording = false;
var mediaRecorder = null;
var audioChunks = [];
var currentMidiUrl = null;
var _recMimeType = null;
var _currentTaskId = null;

// 浏览器兼容的 MediaRecorder MIME 类型检测
function _bestRecMimeType() {
  var types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4', 'audio/wav'];
  for (var i = 0; i < types.length; i++) {
    if (MediaRecorder.isTypeSupported(types[i])) return types[i];
  }
  return ''; // 浏览器自己选
}

function showEl(el){ el.classList.add('on'); }
function hideEl(el){ el.classList.remove('on'); }
function hideAll(){
  hideEl(tscUpload); hideEl(tscProg); hideEl(tscResult);
  tscError.style.display = 'none';
}

// Open / Close
tscCard.addEventListener('click', function(){
  hideAll(); showEl(tscUpload);
  showEl(tscOvl);
  if(tscAtRender) tscAtRender.innerHTML = '';
  currentMidiUrl = null;
  tscError.style.display = 'none';
  loadHistory();
});
function closeTranscriber(){
  stopPlayback(); hideEl(tscOvl); stopRecording(true);
  _currentTaskId = null; tscCancel.disabled = false; tscCancel.style.opacity = '';
  tscCancel.textContent = '✕ 取消转录';
  // 历史扒谱在智能扒谱弹窗内部展示
}

tscClose.addEventListener('click', closeTranscriber);
document.getElementById('tscBack').addEventListener('click', closeTranscriber);
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && tscOvl.classList.contains('on')){
    closeTranscriber();
  }
});

// File upload
tscPick.addEventListener('click', function(){ tscFile.click(); });
tscFile.addEventListener('change', function(){
  if(tscFile.files.length) handleFile(tscFile.files[0]);
});

// Drag & drop
var tscDropZone = document.getElementById('tscDropZone');
tscDropZone.addEventListener('dragover', function(e){ e.preventDefault(); tscDropZone.classList.add('drag'); });
tscDropZone.addEventListener('dragleave', function(){ tscDropZone.classList.remove('drag'); });
tscDropZone.addEventListener('drop', function(e){
  e.preventDefault(); tscDropZone.classList.remove('drag');
  var f = e.dataTransfer.files[0];
  if(f) handleFile(f);
});

function showError(msg){
  hideAll();
  showEl(tscUpload);
  tscError.style.display = 'block';
  tscErrorTxt.textContent = msg;
}

// Retry button — reset state and let user choose a new file
document.getElementById('tscRetryBtn').addEventListener('click', function(){
  tscError.style.display = 'none';
  tscFile.value = '';
  tscErrorTxt.textContent = '';
  _currentTaskId = null;
});

// 格式化相对时间
function fmtRelativeTime(unixTs){
  var diff = Date.now() / 1000 - unixTs;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.round(diff / 60) + '分钟前';
  if (diff < 86400) return Math.round(diff / 3600) + '小时前';
  if (diff < 604800) return Math.round(diff / 86400) + '天前';
  return new Date(unixTs * 1000).toLocaleDateString('zh-CN');
}

// History
function loadHistory(){
  var list = document.getElementById('tscHistList');
  var wrap = document.getElementById('tscHistory');
  list.innerHTML = '<div style="text-align:center;color:#5a4a70;font-size:12px;padding:8px">⏳ 加载历史...</div>';
  wrap.style.display = '';

  fetch(API + '/api/transcriptions')
    .then(function(r){ return r.json(); })
    .then(function(items){
      if (!items || !items.length) {
        list.innerHTML = '<div style="text-align:center;color:#3a2a50;font-size:12px;padding:8px">暂无历史转录</div>';
        return;
      }
      list.innerHTML = items.map(function(it){
        var title = it.title || it.task_id.slice(0, 12);
        var label = (it.note_count || '?') + '音符 · ' + (it.duration || '?') + 's · ' + (it.tempo || '?') + 'BPM';
        var timeStr = it.timestamp ? fmtRelativeTime(it.timestamp) : '';
        return '<div class="tsc-hist-item" data-tid="' + it.task_id + '">' +
          '<div class="hi2" style="flex:1;min-width:0">' +
            '<div class="hi2-title"><span class="hi2-txt">' + escHtml(title) + '</span><button class="rn-btn" data-tid="' + it.task_id + '" title="重命名">✏️</button></div>' +
            '<div class="hi2-sub">' + timeStr + ' · ' + label + '</div>' +
          '</div>' +
          '</div>';
      }).join('');
      list.querySelectorAll('.tsc-hist-item').forEach(function(el){
        el.addEventListener('click', function(e){
          if(e.target.closest('.rn-btn')) return;
          loadCached(el.dataset.tid);
        });
      });
      list.querySelectorAll('.rn-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.stopPropagation();
          renameTranscription(btn.dataset.tid);
        });
      });
    }).catch(function(){
      list.innerHTML = '<div style="text-align:center;color:#3a2a50;font-size:12px;padding:8px">⚠ 后端未连接，历史不可用</div>';
    });
}

// HTML escape for user-provided text
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Rename transcription
function renameTranscription(taskId){
  var item = document.querySelector('.tsc-hist-item[data-tid="' + taskId + '"]');
  var titleEl = item ? item.querySelector('.hi2-txt') : null;
  var oldTitle = titleEl ? titleEl.textContent : '';
  var newTitle = prompt('重命名扒谱：', oldTitle);
  if(!newTitle || newTitle.trim() === '' || newTitle === oldTitle) return;
  newTitle = newTitle.trim().slice(0, 100);
  fetch(API + '/api/transcriptions/' + taskId + '/rename', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title: newTitle})
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d.status === 'ok' && titleEl) titleEl.textContent = d.title;
  }).catch(function(){});
}

function loadCached(taskId){
  hideAll(); showEl(tscProg);
  tscProgTxt.textContent = '加载历史转录...';
  tscProgBar.style.width = '30%';
  fetch(API + '/api/status/' + taskId)
    .then(function(r){ return r.json(); })
    .then(function(data){
      tscProgBar.style.width = '100%';
      if (data.status === 'done'){
        showResult(data);
      } else {
        showError('缓存加载失败');
      }
    }).catch(function(){ showError('加载失败'); });
}

function handleFile(file){
  // 前端校验
  var allowedExts = ['.mp3','.wav','.ogg','.flac','.m4a','.webm'];
  var ext = file.name.toLowerCase().slice(file.name.lastIndexOf('.'));
  if (allowedExts.indexOf(ext) === -1) {
    showError('不支持 ' + ext + ' 格式，请使用 MP3/WAV/OGG/FLAC/M4A');
    return;
  }
  if (file.size > 50 * 1024 * 1024) {
    showError('文件过大（最大 50MB），当前 ' + (file.size / 1024 / 1024).toFixed(1) + 'MB');
    return;
  }

  hideAll(); showEl(tscProg);
  tscError.style.display = 'none';
  tscProgTxt.textContent = '正在上传... (' + (file.size / 1024 / 1024).toFixed(1) + 'MB)';
  tscProgBar.style.width = '5%';
  _currentTaskId = null;

  var fd = new FormData();
  fd.append('audio', file);
  fetch(API + '/api/transcribe', { method: 'POST', body: fd })
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.task_id) {
        _currentTaskId = data.task_id;
        pollTask(data.task_id);
      } else showError(data.detail || '上传失败');
    })
    .catch(function(e){ showError('无法连接后端服务，请确保已启动 guitar-transcriber/start.bat'); });
}

// Recording
tscRec.addEventListener('click', function(){
  if(recording){ stopRecording(); return; }
  startRecording();
});

function startRecording(){
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
    audioChunks = [];
    _recMimeType = _bestRecMimeType();
    var opts = _recMimeType ? { mimeType: _recMimeType } : {};
    mediaRecorder = new MediaRecorder(stream, opts);
    var actualType = mediaRecorder.mimeType || _recMimeType || 'audio/webm';
    var ext = actualType.split('/')[1] || 'webm';
    mediaRecorder.ondataavailable = function(e){ audioChunks.push(e.data); };
    mediaRecorder.onstop = function(){
      var blob = new Blob(audioChunks, { type: actualType });
      handleFile(new File([blob], 'recording.' + ext, { type: actualType }));
      stream.getTracks().forEach(function(t){ t.stop(); });
    };
    mediaRecorder.start();
    recording = true;
    tscRec.textContent = '⏹ 停止录音';
    tscRec.classList.add('on');
  }).catch(function(){ showError('无法访问麦克风，请检查权限设置'); });
}

function stopRecording(skipUpload){
  if(mediaRecorder && recording){
    if(skipUpload) {
      mediaRecorder.onstop = null;
      if(mediaRecorder.stream) mediaRecorder.stream.getTracks().forEach(function(t){ t.stop(); });
    }
    mediaRecorder.stop();
    recording = false;
    tscRec.textContent = '🎤 录音';
    tscRec.classList.remove('on');
  }
}

// Poll task with real progress
function pollTask(taskId){
  var interval = setInterval(function(){
    fetch(API + '/api/status/' + taskId)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.status === 'error'){
          clearInterval(interval); hideEl(tscCancel);
          showError(data.message || '转录失败');
        } else if(data.status === 'cancelled'){
          clearInterval(interval); hideEl(tscCancel);
          showError('转录已取消');
        } else if(data.status === 'done'){
          clearInterval(interval); hideEl(tscCancel);
          tscProgBar.style.width = '100%';
          tscProgTxt.textContent = '转录完成 ✓';
          setTimeout(function(){ showResult(data); }, 400);
        } else {
          var pct = Math.min(99, Math.max(3, data.progress || 0));
          var pctEl = document.getElementById('tscProgPct');
          if(pctEl) pctEl.textContent = Math.round(pct) + '%';
          tscProgBar.style.width = pct + '%';
          tscProgTxt.textContent = data.message || '正在分析音频...';
        }
      })
      .catch(function(){
        clearInterval(interval); hideEl(tscCancel);
        showError('连接后端失败，请确认服务已启动');
      });
  }, 1500);
}

// Show result
function showResult(data){
  hideAll();

  // Title and meta
  var title = data.title || '扒谱结果';
  document.getElementById('tscResultTitle').textContent = title;
  document.getElementById('tscResultMeta').textContent =
    (data.duration || 0) + 's · ' + (data.tempo || '-') + 'BPM · ' + (data.num_bars || 0) + '小节';

  document.getElementById('tscNoteCnt').textContent = data.note_count || 0;
  document.getElementById('tscChordCnt').textContent = data.chord_count || 0;
  document.getElementById('tscDur').textContent = (data.duration || 0) + 's';
  document.getElementById('tscTempo').textContent = data.tempo || '-';

  currentMidiUrl = API + data.midi_url;

  // Store tab data for capo re-render
  window._tscTabData = data;
  window._tscCapo = 0;
  document.getElementById('tscCapoVal').textContent = '0';

  // Render guitar tab using Canvas
  renderTab(data, 0);

  showEl(tscResult);
  hideEl(tscProg);
}

// Capo controls in transcription result
document.getElementById('tscCapoDown').addEventListener('click', function(){
  if(window._tscCapo > 0){
    window._tscCapo--;
    document.getElementById('tscCapoVal').textContent = window._tscCapo;
    renderTab(window._tscTabData, window._tscCapo);
  }
});
document.getElementById('tscCapoUp').addEventListener('click', function(){
  if(window._tscCapo < 11){
    window._tscCapo++;
    document.getElementById('tscCapoVal').textContent = window._tscCapo;
    renderTab(window._tscTabData, window._tscCapo);
  }
});

// Cancel transcription
tscCancel.addEventListener('click', function(){
  if(!_currentTaskId) return;
  var btn = tscCancel;
  btn.textContent = '⏳ 取消中...';
  btn.disabled = true;
  btn.style.opacity = '0.5';
  fetch(API + '/api/cancel/' + _currentTaskId, { method: 'POST' })
    .then(function(){})
    .catch(function(){});
});

// Download
document.getElementById('tscDownloadMidi').addEventListener('click', function(){
  if(currentMidiUrl){ var a = document.createElement('a'); a.href = currentMidiUrl; a.download = 'transcription.mid'; a.click(); }
});
document.getElementById('tscNew').addEventListener('click', function(){
  stopPlayback();
  hideAll(); showEl(tscUpload);
  tscAtRender.innerHTML = '';
  currentMidiUrl = null;
  tscError.style.display = 'none';
});

// ===== Playback engine (Karplus-Strong guitar synthesis + reverb) =====
var _pbCtx = null;
var _pbNodes = [];
var _pbTimer = null;
var _pbPlaying = false;
var _pbBarIdx = -1;

var _REVERB_IR = null;
function _getReverb(ctx) {
  // Generate a simple reverb impulse response (algorithmic)
  if (_REVERB_IR && _REVERB_IR.sampleRate === ctx.sampleRate) return _REVERB_IR;
  var sr = ctx.sampleRate;
  var len = Math.floor(sr * 1.2); // 1.2s reverb tail
  var buf = ctx.createBuffer(2, len, sr);
  for (var ch = 0; ch < 2; ch++) {
    var d = buf.getChannelData(ch);
    for (var i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(0.001, i / len);
    }
  }
  _REVERB_IR = buf;
  return buf;
}

function createKSBuffer(ctx, freq, durSec, velocity) {
  var sr = ctx.sampleRate;
  var period = Math.max(2, Math.round(sr / freq));
  // Ring time: 3x notated, frequency-dependent extension for low notes
  var ringTime = Math.max(durSec, 0.3) * 3;
  if (freq < 150) ringTime = Math.max(ringTime, 3.0);
  else if (freq < 250) ringTime = Math.max(ringTime, 2.0);
  else if (freq < 400) ringTime = Math.max(ringTime, 1.2);
  var totalSamples = Math.floor(sr * ringTime);
  var buf = ctx.createBuffer(1, totalSamples, sr);
  var d = buf.getChannelData(0);

  // ——— Lowpass-filtered noise burst (softer, warmer attack) ———
  var noiseLP = 0;
  for (var i = 0; i < period && i < totalSamples; i++) {
    noiseLP += (Math.random() * 2 - 1 - noiseLP) * 0.25;
    d[i] = noiseLP;
  }

  // ——— Frequency-dependent decay (low notes ring longer) ———
  // t60 = time for -60dB, ~3.5s at 80Hz, ~1s at 1kHz
  var t60 = 4.0 - (freq - 80) / 3500 * 3.0;
  t60 = Math.max(0.8, Math.min(4.5, t60));
  var decay = Math.pow(0.001, 1 / (t60 * sr));

  // ——— One-pole lowpass in feedback loop for warmer tone ———
  var lpCoeff = Math.min(0.85, 0.1 + freq / 2000 * 0.45);
  var lpState = 0;

  // ——— DC blocker (prevents low-frequency rumble/click) ———
  var dcPrevIn = 0, dcPrevOut = 0;
  var DC_R = 0.995;

  for (var i = period; i < totalSamples; i++) {
    // Basic KS: two-point average
    var avg = (d[i - period] + (i > period ? d[i - period - 1] : d[i - period])) * 0.5;
    // Warm up via one-pole lowpass
    lpState += lpCoeff * (avg - lpState);
    var sample = lpState * decay;
    // DC blocker: y(n) = x(n) - x(n-1) + R * y(n-1)
    var dcOut = sample - dcPrevIn + DC_R * dcPrevOut;
    dcPrevIn = sample;
    dcPrevOut = dcOut;
    d[i] = dcOut;
  }

  // ——— Envelope: quick attack, sustain, quadratic release ———
  var amp = (velocity || 100) / 127 * 0.28;
  var atkLen = Math.min(period, Math.floor(sr * 0.003));
  var susLen = Math.floor(sr * Math.max(durSec, 0.15));
  for (var i = 0; i < totalSamples; i++) {
    var env;
    if (i < atkLen) {
      env = i / atkLen;
    } else if (i < susLen) {
      env = 1;
    } else {
      var rt = (i - susLen) / (totalSamples - susLen);
      env = 1 - rt * rt * 0.95;  // quadratic fade to near-zero
    }
    d[i] *= amp * Math.max(0, env);
  }

  return buf;
}

function _ensurePlaybackGraph(ctx) {
  // Build shared graph: dry -> destination, wet -> reverb -> destination
  var dry = ctx.createGain();
  dry.gain.value = 0.7;
  dry.connect(ctx.destination);

  var reverb = ctx.createConvolver();
  reverb.buffer = _getReverb(ctx);
  reverb.normalize = true;

  var wet = ctx.createGain();
  wet.gain.value = 0.25;
  wet.connect(ctx.destination);

  reverb.connect(wet);

  return { dry: dry, reverb: reverb };
}

function playTab(data) {
  stopPlayback();

  var ctx = new (window.AudioContext || window.webkitAudioContext)();
  _pbCtx = ctx;
  _pbPlaying = true;

  var graph = _ensurePlaybackGraph(ctx);

  var tempo = data.tempo || 120;
  var spb = 60 / tempo;
  var now = ctx.currentTime + 0.1;

  var bars = data.bars || [];
  if (!bars.length) { stopPlayback(); return; }

  for (var bi = 0; bi < bars.length; bi++) {
    var notes = bars[bi].notes || [];
    var barStartBeat = bi * 4;
    for (var ni = 0; ni < notes.length; ni++) {
      var n = notes[ni];
      var freq = 440 * Math.pow(2, (n.pitch - 69) / 12);
      var startTime = now + (barStartBeat + n.beat) * spb;
      var dur = Math.max(0.08, n.duration * spb);

      var buf = createKSBuffer(ctx, freq, dur, n.velocity || 100);
      var src = ctx.createBufferSource();
      src.buffer = buf;
      var g = ctx.createGain();
      // Fade out at the very end of the buffer to avoid click
      var bufDur = buf.duration;
      g.gain.setValueAtTime(1, startTime);
      g.gain.setValueAtTime(1, startTime + bufDur - 0.02);
      g.gain.linearRampToValueAtTime(0, startTime + bufDur);
      // Connect to both dry and reverb
      src.connect(g);
      g.connect(graph.dry);
      g.connect(graph.reverb);
      src.start(startTime);
      // No hard stop — buffer plays to end naturally
      _pbNodes.push(src, g);
    }
  }

  // Highlight
  var totalBars = bars.length;
  var totalBeats = totalBars * 4;
  var endTime = now + totalBeats * spb;

  function updateHighlight() {
    if (!_pbPlaying) return;
    var elapsed = ctx.currentTime - now;
    if (elapsed < 0) { _pbTimer = requestAnimationFrame(updateHighlight); return; }
    var beat = elapsed / spb;
    var barIdx = Math.floor(beat / 4);

    if (barIdx !== _pbBarIdx && barIdx < totalBars) {
      var prev = document.querySelector('.tsc-bar-playing');
      if (prev) prev.classList.remove('tsc-bar-playing');
      var cur = document.querySelector('[data-bar-idx="' + barIdx + '"]');
      if (cur) cur.classList.add('tsc-bar-playing');
      _pbBarIdx = barIdx;

      if (cur) {
        var wrap = document.getElementById('tscAtWrap');
        var wrapTop = wrap.scrollTop;
        var wrapH = wrap.clientHeight;
        var curTop = cur.offsetTop - wrap.offsetTop;
        if (curTop < wrapTop || curTop > wrapTop + wrapH - cur.offsetHeight) {
          wrap.scrollTop = curTop - wrapH / 3;
        }
      }
    }

    if (ctx.currentTime < endTime + 2) {
      _pbTimer = requestAnimationFrame(updateHighlight);
    } else {
      setTimeout(function() { stopPlayback(); }, 200);
    }
  }
  _pbTimer = requestAnimationFrame(updateHighlight);

  document.getElementById('tscPlay').style.display = 'none';
  document.getElementById('tscStop').style.display = '';
}

function stopPlayback() {
  _pbPlaying = false;
  if (_pbTimer) { cancelAnimationFrame(_pbTimer); _pbTimer = null; }
  _REVERB_IR = null;

  for (var i = 0; i < _pbNodes.length; i++) {
    try { _pbNodes[i].stop(); _pbNodes[i].disconnect(); } catch(e) {}
  }
  _pbNodes = [];

  if (_pbCtx && _pbCtx.state !== 'closed') {
    try { _pbCtx.close(); } catch(e) {}
  }
  _pbCtx = null;

  var prev = document.querySelector('.tsc-bar-playing');
  if (prev) prev.classList.remove('tsc-bar-playing');
  _pbBarIdx = -1;

  document.getElementById('tscPlay').style.display = '';
  document.getElementById('tscStop').style.display = 'none';
}

document.getElementById('tscPlay').addEventListener('click', function(){
  if (window._tscTabData) playTab(window._tscTabData);
});
document.getElementById('tscStop').addEventListener('click', function(){
  stopPlayback();
});

})();
</script>
